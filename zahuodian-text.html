<style>
:root{
  --ink:#2b2320;
  --ink-soft:#6b5b53;
  --paper:#fbf6ef;
  --line:rgba(43,35,32,.14);
  --accent:#c2707f;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:#ece2d7}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:transparent;
  line-height:1.72;
  overflow-x:hidden;
  min-height:100vh;
}
/* ---------------- 底色：和杂货店同一片粉蓝雾 ---------------- */
.bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 50% at 18% 8%,#f7dce6,transparent 62%),
    radial-gradient(55% 60% at 88% 26%,#d7e4f6,transparent 64%),
    radial-gradient(70% 60% at 50% 100%,#f3e6d6,transparent 70%),
    #ece2d7;
}
main{
  position:relative;z-index:1;
  max-width:720px;margin:0 auto;
  padding:clamp(20px,4vh,40px) clamp(16px,4.5vw,32px) 72px;
}
/* ---------------- 回去 ---------------- */
.back{
  display:inline-flex;align-items:center;
  font-size:13px;letter-spacing:.09em;
  color:var(--ink-soft);text-decoration:none;
  padding:5px 0;margin:0 0 16px;
  transition:color .18s ease;
}
.back:hover{color:var(--ink)}
/* ---------------- 页头 ---------------- */
.head h1{
  font-family:var(--font-body);
  font-size:clamp(25px,4.4vw,33px);
  font-weight:normal;letter-spacing:.26em;line-height:1.12;
  margin:0;
}
.head .sub{
  font-size:11px;letter-spacing:.34em;
  color:rgba(107,91,83,.68);margin:7px 0 0;
}
.head .intro{
  margin:16px 0 0;
  font-size:clamp(13px,1.6vw,14.5px);
  color:var(--ink-soft);letter-spacing:.03em;line-height:1.85;
}
/* ---------------- 面板 ---------------- */
.panel{
  margin:clamp(18px,3.4vh,28px) 0 0;
  background:rgba(253,249,242,.84);
  border:1px solid var(--line);
  border-radius:18px;
  padding:clamp(16px,3vw,24px);
  -webkit-backdrop-filter:blur(10px) saturate(1.06);
  backdrop-filter:blur(10px) saturate(1.06);
  box-shadow:0 18px 40px rgba(84,60,52,.10);
}
.ta-label{
  display:block;font-size:12.5px;color:var(--ink-soft);
  letter-spacing:.05em;margin:0 0 7px;
}
textarea{
  width:100%;min-height:210px;resize:vertical;
  font:inherit;font-size:14.5px;line-height:1.78;
  color:var(--ink);
  background:rgba(255,255,255,.74);
  border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;outline:none;
  -webkit-appearance:none;appearance:none;
  transition:border-color .2s ease,background .2s ease;
}
textarea::placeholder{color:rgba(107,91,83,.5)}
textarea:focus{border-color:rgba(43,35,32,.32);background:#fff}
.ta-row{display:flex;align-items:center;gap:12px;margin:14px 0 0;flex-wrap:wrap}
.ta-go{
  font:inherit;font-size:13.5px;letter-spacing:.11em;
  color:#fff;background:var(--accent);
  border:0;border-radius:999px;
  padding:10px 22px;cursor:pointer;
  box-shadow:0 8px 20px rgba(194,112,127,.28);
  transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease;
}
.ta-go:hover{transform:translateY(-1px);box-shadow:0 11px 24px rgba(194,112,127,.34)}
.ta-go:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none}
.ta-msg{font-size:12.5px;color:var(--ink-soft);letter-spacing:.03em}
/* ---------------- 结果 ---------------- */
.tares{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
  gap:8px;margin:18px 0 0;
  animation:res-in .26s ease both;
}
.tares[hidden]{display:none}
.tares > div{
  background:rgba(255,255,255,.7);
  border:1px solid rgba(43,35,32,.08);
  border-radius:10px;padding:9px 11px;
}
.tares dt{font-size:11.5px;color:var(--ink-soft);letter-spacing:.04em}
.tares dd{margin:2px 0 0;font-size:18px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
@keyframes res-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .tares{animation:none}
  .ta-go,.back{transition:none}
  .ta-go:hover{transform:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main class="page">
  <a class="back" href="zahuodian.html">‹ 回杂货店</a>
  <header class="head">
    <h1>文本分析</h1>
    <div class="sub">TEXT ANALYSIS</div>
    <p class="intro">分析字符数、标点数等。</p>
  </header>

  <section class="panel">
    <label class="ta-label" for="taIn">把一段字放进来</label>
    <textarea id="taIn" placeholder="粘贴或写点什么都行……" spellcheck="false"></textarea>
    <div class="ta-row">
      <button class="ta-go" id="taGo" type="button">数一数</button>
      <span class="ta-msg" id="taMsg" role="status" aria-live="polite"></span>
    </div>
    <dl class="tares" id="taRes" hidden>
      <div><dt>字符数</dt><dd data-k="total_chars_unicode">—</dd></div>
      <div><dt>字节</dt><dd data-k="total_bytes">—</dd></div>
      <div><dt>汉字</dt><dd data-k="chinese_chars">—</dd></div>
      <div><dt>英文字母</dt><dd data-k="english_letters">—</dd></div>
      <div><dt>数字</dt><dd data-k="numbers">—</dd></div>
      <div><dt>标点</dt><dd data-k="punctuation_marks">—</dd></div>
      <div><dt>空白</dt><dd data-k="whitespace_chars">—</dd></div>
    </dl>
  </section>
</main>

<script>
(function () {
  "use strict";

  var TA_URL = "https://uapis.cn/api/v1/text/analyze";
  var busy = false;

  function set(k, v) {
    var el = document.querySelector('#taRes [data-k="' + k + '"]');
    if (el) el.textContent = (v === null || v === undefined) ? '—' : v;
  }

  function run() {
    if (busy) return;
    var text = document.getElementById('taIn').value;
    var msg = document.getElementById('taMsg');
    var btn = document.getElementById('taGo');
    if (!text.trim()) { msg.textContent = '先放点字进来。'; return; }
    busy = true;
    btn.disabled = true;
    btn.textContent = '数着…';
    msg.textContent = '';
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 12000) : null;
    fetch(TA_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text }),
      signal: ctl ? ctl.signal : undefined
    }).then(function (res) {
      if (timer) clearTimeout(timer);
      if (!res.ok) throw new Error('http ' + res.status);
      return res.json();
    }).then(function (d) {
      if (!d || typeof d.total_chars_unicode !== 'number') throw new Error('bad');
      set('total_chars_unicode', d.total_chars_unicode);
      set('total_bytes', d.total_bytes);
      set('chinese_chars', d.chinese_chars);
      set('english_letters', d.english_letters);
      set('numbers', d.numbers);
      set('punctuation_marks', d.punctuation_marks);
      set('whitespace_chars', d.whitespace_chars);
      document.getElementById('taRes').hidden = false;
      msg.textContent = '';
    }).catch(function (e) {
      if (timer) clearTimeout(timer);
      msg.textContent = (e && e.name === 'AbortError') ? '它没应声，等一下再试。' : '没数成，再试一次。';
    }).then(function () {
      busy = false;
      btn.disabled = false;
      btn.textContent = '数一数';
    });
  }

  document.getElementById('taGo').addEventListener('click', run);
  document.getElementById('taIn').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); run(); }
  });
})();
</script>
