  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌙%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/base.css?v=2026102410">
  <style>
    body { min-height: 100vh; margin: 0; background: linear-gradient(180deg, #fff8e1 0%, #fdeaf0 52%, #e6f1ff 100%); color: #222; display: flex; flex-direction: column; align-items: center; }
    .top { width: calc(100% - 32px); max-width: 480px; display: flex; align-items: center; justify-content: space-between; margin-top: 20px; }
    .top a { color: #222; text-decoration: none; font-size: 16px; }
    .top h1 { font-size: 22px; font-weight: normal; letter-spacing: .2em; margin: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.05; }
    .top h1 small { font-family: Georgia, "Times New Roman", serif; font-size: 8.5px; font-weight: normal; letter-spacing: .3em; color: #bda994; margin-top: 4px; margin-right: -.3em; }

    .idx { margin-top: 30px; width: calc(100% - 64px); max-width: 420px; background: rgba(255,255,255,.74); border: 1.5px solid rgba(122,92,72,.16); border-radius: 24px; padding: 22px 22px 14px; box-shadow: 0 10px 30px rgba(180,150,120,.16); box-sizing: border-box; }
    .idx .lb { font-size: 11.5px; letter-spacing: .28em; color: #b08a3d; }

    .seedline { margin-top: 13px; padding-top: 10px; border-top: 1px dashed rgba(122,92,72,.14); font-size: 9.5px; color: #b8a898; letter-spacing: .02em; line-height: 1.85; font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }
    .seedline b { font-weight: normal; color: #a8874a; }

<body>
  <div class="top"><a href="bank.html">‹ 回去</a><h1>市场<small>MOONLIGHT INDEX</small></h1><span style="width:48px"></span></div>

  <div class="idx">
    <div class="lb">月光指数</div>

  </div>

  <div class="foot">没有人推它，也没有人拉它<br>它只是自己走</div>

<script>
  (function () {
    const $ = id => document.getElementById(id);

    /* ========== 参数 ========== */
    const TAG = '111717';
    const START = '2026-10-01';       // 指数从这天开盘的 1000 点起算
    const BASE_IDX = 1000;
    const PERIOD = 3500;              // 每 3.5 秒一步
    const SEG_STEPS = 312;            // 一段 312 步 = 18.2 分钟（性格换一次）
    const DAY_MS = 86400000;
    const STEPS_DAY = Math.floor(DAY_MS / PERIOD);          // 一天 24685 步
    const SEGS_DAY = STEPS_DAY / SEG_STEPS;                 // 一天 79.12 段（漂移折算用）

    /* ========== 后端 ========== */
    const SB_URL = 'https://zvuvncxdyxsgiqurkork.supabase.co';
    const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2dXZuY3hkeXhzZ2lxdXJrb3JrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MTg4MzEsImV4cCI6MjEwNjQ5NDgzMX0.t94gMYY277tAPHo65HIctRbIRiMog-JO3Yv8tAa66aA';
    const withKey = url => url + (url.indexOf('?') < 0 ? '?' : '&') + 'apikey=' + encodeURIComponent(SB_ANON);

    async function rpc(name, body) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 6000);
      try {
        const r = await fetch(withKey(SB_URL + '/rest/v1/rpc/' + name), {
          method: 'POST',
          headers: { apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON, 'Content-Type': 'application/json' },
          body: JSON.stringify(body || {}),
          signal: ctrl.signal
        });
        if (!r.ok) return null;
        return await r.json();
      } catch (e) {
        return null;
      } finally {
        clearTimeout(timer);
      }
    }

    async function fetchAnchors() {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 6000);
      try {
        const r = await fetch(withKey(SB_URL + '/rest/v1/index_anchor?select=day,open_price,close_price&order=day.asc'), {
          headers: { apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON },
          signal: ctrl.signal
        });
        if (!r.ok) return null;
        const arr = await r.json();
        return Array.isArray(arr) ? arr : null;
      } catch (e) {
        return null;
      } finally {
        clearTimeout(timer);
      }
    }

    /* ========== SHA-256（纯 JS） ========== */
    function sha256(str) {
      const R = (v, a) => (v >>> a) | (v << (32 - a));
      const pw = Math.pow, MAX = pw(2, 32);
      let result = '';
      const words = [], bitLen = str.length * 8;
      const H = sha256.h || (sha256.h = []);
      const k = sha256.k || (sha256.k = []);
      let counter = k.length;
      if (counter < 64) {
        const isComp = {};
        for (let c = 2; counter < 64; c++) {
          if (!isComp[c]) {
            for (let i = 0; i < 313; i += c) isComp[i] = c;
            H[counter] = (pw(c, .5) * MAX) | 0;
            k[counter++] = (pw(c, 1 / 3) * MAX) | 0;
          }
        }
      }
      let s = str + '\x80';
      while (s.length % 64 - 56) s += '\x00';
      for (let i = 0; i < s.length; i++) words[i >> 2] |= s.charCodeAt(i) << ((3 - i) % 4) * 8;
      words[words.length] = (bitLen / MAX) | 0;
      words[words.length] = bitLen;

      let cv = H.slice(0, 8);            // 链值：每块结束后更新，但不回写常量表
      for (let j = 0; j < words.length;) {
        const w = words.slice(j, j += 16);
        const old = cv;
        let h = cv.slice(0, 8);
        for (let i = 0; i < 64; i++) {
          const w15 = w[i - 15], w2 = w[i - 2];
          const a = h[0], e = h[4];
          const t1 = h[7] + (R(e, 6) ^ R(e, 11) ^ R(e, 25)) + ((e & h[5]) ^ (~e & h[6])) + k[i] +
            (w[i] = i < 16 ? w[i] : (w[i - 16] + (R(w15, 7) ^ R(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (R(w2, 17) ^ R(w2, 19) ^ (w2 >>> 10)) | 0));
          const t2 = (R(a, 2) ^ R(a, 13) ^ R(a, 22)) + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
          h = [(t1 + t2) | 0].concat(h);
          h[4] = (h[4] + t1) | 0;
        }
        const next = new Array(8);
        for (let i = 0; i < 8; i++) next[i] = ((h[i] || 0) + (old[i] || 0)) | 0;
        cv = next;
      }
      for (let i = 0; i < 8; i++) {
        for (let j = 3; j + 1; j--) {
          const b = (cv[i] >> (j * 8)) & 255;
          result += (b < 16 ? '0' : '') + b.toString(16);
        }
      }
      return result;
    }

    /* ========== 随机数 ========== */
    function mulberry32(a) {
      return function () {
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function gauss(rng) {
      let u = 0, v = 0;
      while (u === 0) u = rng();
      while (v === 0) v = rng();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
    const seed14 = hex => (BigInt('0x' + hex) % 100000000000000n).toString().padStart(14, '0');
    const pad2 = n => String(n).padStart(2, '0');
    const normDay = d => String(d).replace(/-/g, '');   // 后端 date 带横线，统一成 20261001
    const dayKey = d => '' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate());

    /* ========== 每天的缓慢漂移（-1.2% ~ +1.2%） ========== */
    function dayTrend(dstr) {
      const r = mulberry32(parseInt(sha256(dstr + TAG + '#trend').slice(0, 8), 16));
      return (r() - 0.5) * 0.024;
    }

    /* ========== 每段的性格 ========== */
    function segParams(dstr, idx) {
      const hex = sha256(dstr + TAG + '#' + idx);
      const rp = mulberry32(parseInt(hex.slice(0, 8), 16));   // 噪声流
      const rq = mulberry32(parseInt(hex.slice(8, 16), 16));  // 参数流
      return {
        rng: rp,
        sigma: 0.004 + 0.010 * rq(),
        mu: (rq() - 0.5) * 0.002,
        lambda: rq() * 1.2,
        jSd: 0.003 + 0.007 * rq(),
        jMean: -0.0008,
        kappa: 0.6
      };
    }

    /* ========== 单条路径（对数域） ========== */
    function walk(p, f) {
      let d = (p.mu - .5 * p.sigma * p.sigma) * f + p.sigma * Math.sqrt(f) * gauss(p.rng);
      d += p.kappa * (p.logRef - p.logS) * f;
      if (p.rng() < p.lambda * f) d += p.jMean + p.jSd * gauss(p.rng);
      p.logS += d;
      p.logRef += p.trend / SEGS_DAY * f;
      return Math.exp(p.logS);
    }

    /* ========== 状态 ========== */
    const S = { logS: Math.log(BASE_IDX), logRef: Math.log(BASE_IDX), trend: 0, P: null };
    let TODAY_KEY = '';
    let TODAY_OPEN = BASE_IDX;
    let stepsLocal = 0;
    let dayHigh = BASE_IDX, dayLow = BASE_IDX;
    let hist = [];
    let serverMode = false;
    const ANCHOR = { ms: 0, steps: 0 };   // 时间基准，用来校正定时器漂移

    /* 完整走完某一天，返回当天收盘价 */
    function runOneDay(key, openPrice) {
      let logS = Math.log(openPrice), logRef = logS, tr = dayTrend(key);
      let done = 0, idx = 0;
      while (done < STEPS_DAY) {
        const len = Math.min(SEG_STEPS, STEPS_DAY - done);
        const p = segParams(key, idx);
        p.logS = logS; p.logRef = logRef; p.trend = tr;
        logS = Math.log(walk(p, len / SEG_STEPS));
        done += len; idx++;
      }
      return Math.exp(logS);
    }

    /* 从 START 推到 untilDay（不含），但「后端已锁的日子直接跟着走，不重算」，
       只把缺的、或者 close 还是空的行算出来。anchors 传 null 就全部重算。
       返回 { rows: 要补的行, close: untilDay 当天的开盘价 } */
    function fillGaps(anchors, untilDay) {
      const have = {};
      if (anchors) anchors.forEach(function (r) { have[normDay(r.day)] = r; });
      const rows = [];
      let price = BASE_IDX;                       // 前一天的收盘
      const [sy, sm, sd] = START.split('-').map(Number);
      const cursor = new Date(sy, sm - 1, sd);
      while (dayKey(cursor) < untilDay) {
        const key = dayKey(cursor);
        const row = have[key];
        if (row && Number(row.close_price) > 0) {   // 已锁：直接沿用
          price = Number(row.close_price);
        } else {                                    // 缺：模型补齐
          const open = (row && Number(row.open_price) > 0) ? Number(row.open_price) : price;
          const close = runOneDay(key, open);
          rows.push({ d: key, o: Number(open.toFixed(6)), c: Number(close.toFixed(6)) });
          price = close;
        }
        cursor.setDate(cursor.getDate() + 1);
      }
      return { rows: rows, close: price };
    }

    /* 完全不知道后端时用：从 1000 点一路算下来 */
    function runHistory(untilDay) {
      const g = fillGaps(null, untilDay);
      return { rows: g.rows, logS: Math.log(g.close) };
    }

    /* 走今天：从开盘价推到第 steps 步 */
    function buildToday(key, openPrice, steps) {
      TODAY_KEY = key;
      TODAY_OPEN = openPrice;
      S.logS = Math.log(openPrice);
      S.logRef = S.logS;
      S.trend = dayTrend(key);
      S.P = null;

      const path = [];
      let hi = openPrice, lo = openPrice;
      let done = 0, idx = 0;
      while (done < steps) {
        const p = segParams(key, idx);
        p.logS = S.logS; p.logRef = S.logRef; p.trend = S.trend;
        S.P = p;
        const len = Math.min(SEG_STEPS, steps - done);
        for (let i = 0; i < len; i++) {
          const v = walk(p, 1 / SEG_STEPS);
          path.push(v);
          if (v > hi) hi = v;
          if (v < lo) lo = v;
        }
        S.logS = p.logS; S.logRef = p.logRef;
        done += len; idx++;
      }
      if (!S.P) {                                  // 0 点刚过，一步还没走
        const p = segParams(key, 0);
        p.logS = S.logS; p.logRef = S.logRef; p.trend = S.trend;
        S.P = p;
      }
      stepsLocal = path.length;
      dayHigh = hi; dayLow = lo;
      hist = path;
      if (!hist.length) hist.push(openPrice);
      ANCHOR.ms = Date.now(); ANCHOR.steps = stepsLocal;
    }

    /* ========== 画曲线 ========== */
    /* 全天走势：横轴铺满一天（0 点 → 24 点），曲线从左边生长 */
    function drawDay(w, h, color, fill) {
      const n = hist.length;
      if (n < 2) return '';
      const MAXP = 600;
      const pts = [];
      if (n <= MAXP) {
        for (let i = 0; i < n; i++) pts.push([i, hist[i]]);
      } else {
        // 每桶保留最高和最低，尖峰不会被抹平
        const bucket = n / MAXP;
        for (let b = 0; b < MAXP; b++) {
          const i0 = Math.floor(b * bucket);
          const i1 = Math.min(n - 1, Math.floor((b + 1) * bucket) - 1);
          if (i1 < i0) continue;
          let hi = hist[i0], lo = hist[i0], iHi = i0, iLo = i0;
          for (let i = i0; i <= i1; i++) {
            if (hist[i] > hi) { hi = hist[i]; iHi = i; }
            if (hist[i] < lo) { lo = hist[i]; iLo = i; }
          }
          if (iHi <= iLo) { pts.push([iHi, hi]); pts.push([iLo, lo]); }
          else { pts.push([iLo, lo]); pts.push([iHi, hi]); }
        }
      }
      if (pts.length && pts[pts.length - 1][0] < n - 1) pts.push([n - 1, hist[n - 1]]);
      const min = Math.min(dayLow, TODAY_OPEN), max = Math.max(dayHigh, TODAY_OPEN);
      const span = (max - min) || 1;
      const P = pts.map(function (q) {
        const x = (q[0] / Math.max(1, n - 1)) * w;   // 铺满：把已走的部分拉满整宽
        const y = h - 3 - ((q[1] - min) / span) * (h - 8);
        return x.toFixed(1) + ',' + y.toFixed(1);
      });
      if (P.length < 2) return '';
      const lastP = P[P.length - 1].split(',');
      const yOpen = (h - 3 - ((TODAY_OPEN - min) / span) * (h - 8)).toFixed(1);
      let out = '<line x1="0" y1="' + yOpen + '" x2="' + w + '" y2="' + yOpen + '" stroke="rgba(122,101,82,.20)" stroke-width=".8" stroke-dasharray="2 3"/>' +
        '<polygon points="0,' + h + ' ' + P.join(' ') + ' ' + lastP[0] + ',' + h + '" fill="' + fill + '"/>' +
        '<polyline points="' + P.join(' ') + '" stroke="' + color + '" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="none"/>' +
        '<circle cx="' + lastP[0] + '" cy="' + lastP[1] + '" r="2.1" fill="' + color + '"/>';
      return out;
    }

    function paint(animate) {
      if (!TODAY_KEY) return;
      const cur = Math.exp(S.logS);
      const pct = (cur / TODAY_OPEN - 1) * 100;
      const up = pct >= 0;

      const numEl = $('idxNum');
      numEl.textContent = cur.toFixed(2);
      numEl.className = 'num' + (animate ? ' tick' : '');
      if (animate) { void numEl.offsetWidth; }

      $('idxChg').className = 'chg ' + (up ? 'up' : 'dn');
      $('idxChg').textContent = (up ? '▲ ' : '▼ ') + Math.abs(pct).toFixed(2) + '%';

      $('idxSpark').innerHTML = drawDay(300, 96, '#7d93b4', 'rgba(125,147,180,.10)');

      $('sOpen').textContent = TODAY_OPEN.toFixed(2);
      $('sHigh').textContent = dayHigh.toFixed(2);
      $('sLow').textContent = dayLow.toFixed(2);

      const seg = Math.max(0, Math.floor((stepsLocal - 1) / SEG_STEPS));
      const stepIn = stepsLocal - seg * SEG_STEPS;
      const daySeed = seed14(sha256(TODAY_KEY + TAG));
      $('seedline').innerHTML =
        '<div>' + TODAY_KEY + TAG + ' → SHA-256 → <b>' + daySeed + '</b></div>' +
        '<div>第 ' + (seg + 1) + ' 段 · 第 ' + Math.max(1, stepIn) + '/' + SEG_STEPS + ' 步 · 每 3.5 秒一步</div>';
    }

    /* ========== 走一步 ========== */
    function stepOne() {
      if (!S.P || stepsLocal >= STEPS_DAY) return false;
      if (stepsLocal % SEG_STEPS === 0) {          // 进入新的一段，换脾气
        const p = segParams(TODAY_KEY, stepsLocal / SEG_STEPS);
        p.logS = S.logS; p.logRef = S.logRef; p.trend = S.trend;
        S.P = p;
      }
      const v = walk(S.P, 1 / SEG_STEPS);
      S.logS = S.P.logS; S.logRef = S.P.logRef;
      stepsLocal++;
      if (hist.length < STEPS_DAY + 1) hist.push(v);
      if (v > dayHigh) dayHigh = v;
      if (v < dayLow) dayLow = v;
      return true;
    }

    /* 定时器会漂移（卡顿、丢帧），所以每一拍先问「按真实时间现在该走到第几步」，
       落后就一次补齐，不落后就等下一拍。曲线因此永远贴着真实时钟。 */
    function tickOnce() {
      if (!S.P) return;
      const want = ANCHOR.steps + Math.floor((Date.now() - ANCHOR.ms) / PERIOD);
      let moved = false, guard = 0;
      while (stepsLocal < want && stepsLocal < STEPS_DAY && guard++ < 4000) {
        if (!stepOne()) break;
        moved = true;
      }
      if (moved) paint(true);
    }

    /* ========== 收盘价回写（只在午夜前后、后端模式） ========== */
    function sealNow() {
      if (!serverMode) return;
      if (stepsLocal < STEPS_DAY) return;          // 只有真的走满一天才写收盘，避免把 21 点的中途价锁死成历史
      const cur = Math.exp(S.logS);
      if (!(cur > 0)) return;
      fetch(withKey(SB_URL + '/rest/v1/rpc/index_close'), {
        method: 'POST',
        keepalive: true,
        headers: { apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_close: Number(cur.toFixed(6)) })
      }).catch(() => {});
    }

    /* ========== 启动 ========== */
    function localNow() {
      const d = new Date();
      const sec = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
      return { day: dayKey(d), sec: sec };
    }

    function startLocal() {
      const n = localNow();
      const h = runHistory(n.day);
      buildToday(n.day, Math.exp(h.logS), Math.min(STEPS_DAY, Math.floor(n.sec / 3.5)));
      paint(false);
      startTicking();
    }

    async function boot() {
      const st0 = await rpc('index_today');
      if (!st0 || !st0.ok) { startLocal(); return; }        // 后端不通就自己算

      serverMode = true;
      const day = normDay(st0.day);

      // 先读后端已锁的日线，只补「缺的、或者收盘还是空的」那些天。
      // 都齐了就一行都不上传，页面只算今天不到一天的步数。
      const anchors = await fetchAnchors();
      const gap = fillGaps(anchors, day);
      if (gap.rows.length) await rpc('index_backfill', { p_rows: gap.rows });

      const info = gap.rows.length ? ((await rpc('index_today')) || st0) : st0;
      let open = Number(info.open_price);
      if (!(open > 0)) open = gap.close;    // 后端还是没有开盘价，就用模型算出的昨收
      const steps = Math.min(STEPS_DAY, Math.floor(Number(info.sec_of_day) / (PERIOD / 1000)));
      buildToday(normDay(info.day), open, steps);
      paint(false);

      startTicking();
    }

    /* 定时器 + 前后台对表：后端模式和本地模式共用 */
    function startTicking() {
      setInterval(() => {
        if (stepsLocal >= STEPS_DAY) { location.reload(); return; }   // 走满一天，刷新进入新的一天
        tickOnce();
      }, PERIOD);

      document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState === 'hidden') { sealNow(); return; }
        if (serverMode) {
          const s2 = await rpc('index_today');
          if (!s2 || !s2.ok) return;
          if (normDay(s2.day) !== TODAY_KEY) { location.reload(); return; }
          const steps2 = Math.min(STEPS_DAY, Math.floor(Number(s2.sec_of_day) / (PERIOD / 1000)));
          if (Math.abs(steps2 - stepsLocal) > 2) buildToday(TODAY_KEY, Number(s2.open_price), steps2);
        } else {
          const n = localNow();
          if (n.day !== TODAY_KEY) { location.reload(); return; }
          const steps2 = Math.min(STEPS_DAY, Math.floor(n.sec / 3.5));
          if (Math.abs(steps2 - stepsLocal) > 2) {
            const h = runHistory(n.day);
            buildToday(n.day, Math.exp(h.logS), steps2);
          }
        }
        paint(false);
      });

      window.addEventListener('pagehide', sealNow);
    }

    boot();
  })();
</script>
</body>
