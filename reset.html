<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff6e2">
  <title>找回密码 · 给聆遇的游乐园</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎠%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth warm">
  <main class="page">
    <p class="hello">找回密码</p>
    <form id="step1" novalidate>
      <label>注册时的邮箱：<input name="email" type="email" autocomplete="email" required></label>
      <button class="btn-ok" type="submit">确认</button>
    </form>
    <form id="step2" novalidate hidden>
      <p class="tip">如果这个邮箱注册过，验证码已经寄过去了，十分钟内有效哦</p>
      <label>验证码：<input name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required></label>
      <label>新的六位数密码：<input name="password" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" required></label>
      <button class="btn-ok" type="submit">确认</button>
    </form>
    <nav class="links">
      <a href="login.html" data-soft>回去</a>
    </nav>
  </main>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/auth.js?v=2026100401"></script>
  <script>
    (function () {
      const s1 = document.getElementById('step1'), s2 = document.getElementById('step2');
      let email = '';
      s1.onsubmit = async (e) => {
        e.preventDefault();
        email = s1.email.value.trim();
        if (!email) return toast('请输入邮箱');
        const btn = s1.querySelector('button');
        btn.disabled = true;
        const r = await Park.gate('reset_start', { email });
        btn.disabled = false;
        if (!r.ok) return toast(r.msg);
        s1.hidden = true; s2.hidden = false; s2.code.focus();
      };
      s2.onsubmit = async (e) => {
        e.preventDefault();
        const password = s2.password.value;
        if (!/^\d{6}$/.test(password)) return toast('新密码需要是六位数字');
        const btn = s2.querySelector('button');
        btn.disabled = true;
        const r = await Park.gate('reset_verify', { email, password, code: s2.code.value.trim() });
        btn.disabled = false;
        if (!r.ok) return toast(r.msg);
        toast('密码改好啦，用新密码登录吧');
        setTimeout(() => location.replace('login.html?n=' + encodeURIComponent(r.nickname || '')), 1000);
      };
    })();
  </script>
</body>
</html>
