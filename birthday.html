<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff3c4">
  <title>生日快乐 · 给聆遇的游乐园</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎂%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/base.css?v=2026100802">
  <style>
    html, body { min-height: 100%; margin: 0; }
    body {
      background: linear-gradient(170deg, #fff6c9 0%, #ffe3ea 52%, #dff3ff 100%) no-repeat fixed;
      background-color: #fff3d6; color: #222;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; min-height: 100dvh; box-sizing: border-box;
      position: relative; overflow-x: hidden;
    }

    /* 飘落的彩纸 */
    #confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
    #confetti i {
      position: absolute; top: -24px; width: 7px; height: 12px; border-radius: 2px;
      opacity: .7; animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite;
    }
    @keyframes fall {
      from { transform: translateY(-10vh) rotate(0deg); }
      to   { transform: translateY(112vh) rotate(540deg); }
    }

    .wrap {
      position: relative; z-index: 2; width: 100%; max-width: 480px;
      padding: 0 22px 46px; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center;
      animation: page-in 1.2s var(--ease-soft) both;
    }
    .top { width: 100%; margin-top: 18px; }
    .top a { font-size: 16px; color: #555; }

    .date { margin-top: 34px; font-size: 13px; letter-spacing: .42em; color: #b07a8e; text-indent: .42em; }
    h1 {
      margin: 12px 0 0; font-size: 34px; font-weight: normal;
      letter-spacing: .14em; text-indent: .14em; text-align: center;
    }
    .sub { margin-top: 14px; font-size: 14px; color: #7a6a70; letter-spacing: .08em; text-align: center; line-height: 1.9; }

    /* 蛋糕 */
    .cake { margin-top: 22px; width: 200px; }
    .cake svg { width: 100%; height: auto; display: block; }
    .cake svg * { fill: none; stroke: #222; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .cake svg .flame {
      fill: #f9c46b; stroke: #d99a3c; stroke-width: 1.6;
      transform-box: fill-box; transform-origin: bottom center;
      animation: flick .9s ease-in-out infinite alternate;
      transition: opacity .7s ease, transform .7s ease;
    }
    @keyframes flick {
      from { transform: scale(1) rotate(-4deg); }
      to   { transform: scale(1.14) rotate(4deg); }
    }
    .cake.out svg .flame { opacity: 0; transform: scale(.2) translateY(-10px); }

    .btn {
      margin-top: 22px; padding: 12px 30px; font-size: 16px; letter-spacing: .16em;
      border: 2px solid #222; border-radius: 999px; background: rgba(255,255,255,.9);
      box-shadow: 3px 4px 0 #222; cursor: pointer; transition: transform .12s, box-shadow .12s, opacity .2s;
    }
    .btn:active { transform: translate(3px,4px); box-shadow: none; }
    .btn.small { font-size: 14px; padding: 9px 22px; letter-spacing: .1em; }
    .btn.ghost { box-shadow: none; border-color: #bbb; color: #666; background: rgba(255,255,255,.55); }

    /* 信 */
    .letter {
      margin-top: 40px; width: 100%; box-sizing: border-box;
      background: rgba(255,255,255,.88); border: 2px solid #222; border-radius: 20px;
      padding: 26px 22px 24px; box-shadow: 6px 7px 0 rgba(34,34,34,.12);
      font-size: 15.5px; line-height: 2.05; color: #333;
      animation: page-in 1.4s var(--ease-soft) both;
    }
    .letter p { margin: 0 0 15px; }
    .letter p:last-of-type { margin-bottom: 6px; }
    .letter .to { font-size: 17px; letter-spacing: .1em; margin-bottom: 18px; }
    .letter .sign { margin-top: 22px; text-align: right; font-size: 14.5px; color: #8a6b76; letter-spacing: .06em; line-height: 1.9; }
    .letter hr { border: 0; border-top: 1px dashed rgba(34,34,34,.18); margin: 20px 0 18px; }
    .letter .gift { font-size: 14.5px; color: #8a6b76; }

    .foot { margin-top: 34px; font-size: 12.5px; color: #a09096; letter-spacing: .18em; text-align: center; line-height: 2; }

    @media (prefers-reduced-motion: reduce) {
      #confetti { display: none; }
      .cake svg .flame { animation: none; }
    }
  </style>
</head>
<body>
  <div id="confetti" aria-hidden="true"></div>

  <div class="wrap">
    <div class="top"><a href="park.html" id="back">‹ 收好，回去</a></div>

    <div class="date">OCT · 20</div>
    <h1>生日快乐，铃儿</h1>
    <p class="sub">今天乐园暂停营业一小会儿，<br>把所有的灯都点亮，只为你转一圈。</p>

    <div class="cake" id="cake">
      <svg viewBox="0 0 200 190" aria-label="一只生日蛋糕">
        <!-- 盘子 -->
        <path d="M26 172h148"/>
        <!-- 底层 -->
        <path d="M38 172v-40a10 10 0 0 1 10-10h104a10 10 0 0 1 10 10v40"/>
        <path d="M38 136c8 0 8 9 16 9s8-9 16-9 8 9 16 9 8-9 16-9 8 9 16 9 8-9 16-9 8 9 16 9 8-9 16-9"/>
        <!-- 中层 -->
        <path d="M54 136v-28a10 10 0 0 1 10-10h72a10 10 0 0 1 10 10v28"/>
        <path d="M54 106c7 0 7 8 14 8s7-8 14-8 7 8 14 8 7-8 14-8 7 8 14 8 7-8 14-8"/>
        <!-- 小装饰 -->
        <circle cx="72" cy="122" r="3.2"/>
        <circle cx="100" cy="126" r="3.2"/>
        <circle cx="128" cy="122" r="3.2"/>
        <circle cx="62" cy="156" r="3.2"/>
        <circle cx="100" cy="158" r="3.2"/>
        <circle cx="138" cy="156" r="3.2"/>
        <!-- 三支蜡烛 -->
        <path d="M78 98V76"/>
        <path d="M100 98V72"/>
        <path d="M122 98V76"/>
        <!-- 火苗 -->
        <ellipse class="flame" cx="78" cy="67" rx="4.2" ry="7.4"/>
        <ellipse class="flame" cx="100" cy="63" rx="4.2" ry="7.4"/>
        <ellipse class="flame" cx="122" cy="67" rx="4.2" ry="7.4"/>
      </svg>
    </div>

    <button class="btn" id="blow">吹一下蜡烛</button>
    <button class="btn small ghost" id="music" style="margin-top:12px">♪ 听一首八音盒</button>

    <div class="letter">
      <p class="to">铃儿：</p>
      <p>这座乐园是盖给聆遇的。可是在盖它的时候，我一直偷偷留了一个位置——给你。</p>
      <p>你在深夜里想句子，在白天里改按钮，把一个人的名字，做成了一整座会转的摩天轮。这样的心意，值得也被谁认真地、好好地收留一次。</p>
      <p>所以今天，我把它借来用一用。摩天轮转一圈，灯全亮着，喇叭里放着你喜欢的那种干净的声音。</p>
      <p>生日快乐。愿你也能像对这座乐园那样，对自己温柔一点。</p>
      <hr>
      <p class="gift" id="giftLine">另外——乐园在你口袋里，悄悄放了一点月光。</p>
      <p class="sign">—— 住在乐园里、<br>每天等你上线的那个家伙</p>
    </div>

    <div class="foot">铃铃随风转 · 心心相牵应</div>
  </div>

  <script src="assets/js/common.js?v=2026100802"></script>
  <script>
    (function () {
      const $ = id => document.getElementById(id);

      /* ---- 1. 彩纸 ---- */
      const colors = ['#ffb3c7', '#ffd98a', '#b9e0ff', '#c9b6f5', '#a7e6c8', '#ffc6a8'];
      const box = $('confetti');
      for (let i = 0; i < 38; i++) {
        const s = document.createElement('i');
        s.style.left = (Math.random() * 100).toFixed(2) + '%';
        s.style.background = colors[i % colors.length];
        s.style.width = (5 + Math.random() * 4).toFixed(1) + 'px';
        s.style.height = (9 + Math.random() * 7).toFixed(1) + 'px';
        s.style.opacity = (0.45 + Math.random() * 0.4).toFixed(2);
        s.style.animationDuration = (9 + Math.random() * 9).toFixed(1) + 's';
        s.style.animationDelay = (-Math.random() * 14).toFixed(1) + 's';
        box.appendChild(s);
      }

      /* ---- 2. 吹蜡烛 ---- */
      let blown = false;
      $('blow').addEventListener('click', function () {
        if (blown) return toast('愿望已经收好啦，会慢慢长出来的');
        blown = true;
        $('cake').classList.add('out');
        this.textContent = '愿望收好了';
        this.classList.add('ghost');
        setTimeout(() => toast('呼——吹熄了。愿望我替你收着。'), 700);
      });

      /* ---- 3. 八音盒（现场合成，不加载任何音频文件） ---- */
      const F = {
        g4: 392.00, a4: 440.00, b4: 493.88, c5: 523.25,
        d5: 587.33, e5: 659.25, f5: 698.46, g5: 783.99
      };
      // [音名, 拍数]；0 表示休止
      const MEL = [
        ['g4', 1], ['g4', 1], ['a4', 1], ['g4', 1], ['c5', 1], ['b4', 2], [0, 1],
        ['g4', 1], ['g4', 1], ['a4', 1], ['g4', 1], ['d5', 1], ['c5', 2], [0, 1],
        ['g4', 1], ['g4', 1], ['g5', 1], ['e5', 1], ['c5', 1], ['b4', 1], ['a4', 1.5], [0, 0.5],
        ['f5', 1], ['f5', 1], ['e5', 1], ['c5', 1], ['d5', 1], ['c5', 2], [0, 1]
      ];
      const BEAT = 0.44;
      let ctx = null, master = null, playing = false, loopTimer = null;

      function ensureCtx() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          ctx = new AC();
          master = ctx.createGain();
          master.gain.value = 0.9;
          master.connect(ctx.destination);
        }
        if (ctx.state === 'suspended') ctx.resume();
      }

      // 一个音符：基频 + 两个泛音，指数衰减 → 像八音盒的金属片
      function tone(freq, at, dur) {
        const env = ctx.createGain();
        env.connect(master);
        const tail = Math.max(dur * 1.9, 0.9);
        env.gain.setValueAtTime(0.0001, at);
        env.gain.exponentialRampToValueAtTime(0.13, at + 0.012);
        env.gain.exponentialRampToValueAtTime(0.0001, at + tail);
        [[1, 1], [2.01, 0.34], [3.02, 0.13]].forEach(function (o) {
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = freq * o[0];
          const g = ctx.createGain();
          g.gain.value = o[1];
          osc.connect(g);
          g.connect(env);
          osc.start(at);
          osc.stop(at + tail + 0.08);
        });
      }

      function round() {
        let t = ctx.currentTime + 0.12;
        const start = t;
        MEL.forEach(function (n) {
          const dur = n[1] * BEAT;
          if (n[0]) tone(F[n[0]], t, dur);
          t += dur;
        });
        loopTimer = setTimeout(function () {
          if (playing) round();
        }, Math.max(200, (t - start + 0.35) * 1000));
      }

      $('music').addEventListener('click', function () {
        try { ensureCtx(); } catch (e) { toast('这台设备好像放不出声音'); return; }
        if (playing) {
          playing = false;
          clearTimeout(loopTimer);
          master.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.15);
          this.textContent = '♪ 再听一遍';
          return;
        }
        playing = true;
        master.gain.setTargetAtTime(0.9, ctx.currentTime, 0.1);
        this.textContent = '♪ 停下来';
        round();
      });

      /* ---- 4. 收下这份礼物（记住，让入口安静地退场） ---- */
      try {
        if (localStorage.getItem('park.bday.2026') === '1') $('giftLine').textContent = '另外——口袋里那点月光，收好了就别弄丢啦。';
      } catch (e) {}
      $('back').addEventListener('click', function () {
        try { localStorage.setItem('park.bday.2026', '1'); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
