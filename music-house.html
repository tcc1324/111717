<!-- 【暗夜模式】渲染前先读取状态，避免刷新闪亮 -->
<script>try{if(localStorage.getItem('park.house.dark')==='1')document.documentElement.setAttribute('data-night','');var _th=localStorage.getItem('park.house.theme');if(_th&&_th!=='default')document.documentElement.setAttribute('data-theme',_th)}catch(e){}</script>
<!-- 【暗夜模式切换】独立脚本：用一条统一的时间线逐帧驱动夜色、窗外夜空、灯光，
     不依赖浏览器的 CSS transition，各层严格同步：先沉下去，后亮起月亮和灯光；回白天时反过来 -->
<script>
(function(){
  var KEY='park.house.dark', r=document.documentElement;
  var p=0, target=0, raf=0, last=0, DUR=1500, els=null;
  try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)DUR=1}catch(e){}
  function all(q){return Array.prototype.slice.call(document.querySelectorAll(q))}
  function ease(x){x=x<0?0:x>1?1:x;return x*x*(3-2*x)}
  function put(list,v){for(var i=0;i<list.length;i++)list[i].style.opacity=String(Math.round(v*1000)/1000)}
  function apply(){
    if(!els)els={veil:all('#hsVeil'),ns:all('.hs-ns'),fx:all('.hs-fx'),dy:all('.hs-dy')};
    var v=ease(p);
    put(els.veil,v);put(els.ns,v);put(els.dy,1-v);put(els.fx,ease((p-.5)/.5));
    var b=document.getElementById('nightBtn');if(b)b.setAttribute('aria-pressed',target?'true':'false');
  }
  function step(t){
    var dt=last?Math.min(t-last,50):16;last=t;
    var d=target-p,sv=dt/DUR;
    p=Math.abs(d)<=sv?target:p+(d>0?sv:-sv);
    apply();
    if(p!==target)raf=requestAnimationFrame(step);else{raf=0;last=0}
  }
  function go(on){target=on?1:0;if(!raf){last=0;raf=requestAnimationFrame(step)}}
  window.houseNight=function(on,tip){
    if(on)r.setAttribute('data-night','');else r.removeAttribute('data-night');
    try{localStorage.setItem(KEY,on?'1':'0')}catch(e){}
    go(on);
    if(tip&&typeof toast==='function'){try{toast(on?'夜深了，藏起来吧':'天亮了')}catch(e){}}
  };
  window.houseNightToggle=function(){window.houseNight(!r.hasAttribute('data-night'),true)};
  function init(){var on=r.hasAttribute('data-night');p=target=on?1:0;apply()}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

<style>
/* ============================================================
   【壁纸变量】--wall ：以后换图只改这一行，例如
   --wall: url('assets/img/wall.jpg') center / cover no-repeat;
   ============================================================ */
:root{--wall:linear-gradient(180deg,#eddcd0 0%,#e8d4c6 100%);--ink:#4a3a35;--tint:#e8b9a2}
html[data-night]{--ink:#e8e6f2}
/* 主题：换氛围只改这几组变量（壁纸背景 / 文字色 / 氛围滤镜） */
html[data-theme="peach"]{--wall:linear-gradient(180deg,#f7dcc6 0%,#f2cbb4 100%);--ink:#5a3b36;--tint:#f0a88c}
html[data-theme="mint"]{--wall:linear-gradient(180deg,#ddeadd 0%,#cddfcd 100%);--ink:#3f4a3d;--tint:#b7c9a8}
html[data-theme="dusk"]{--wall:linear-gradient(180deg,#dcd8e6 0%,#cbc6da 100%);--ink:#433f52;--tint:#b7aecf}
html[data-theme="cream"]{--wall:linear-gradient(180deg,#f3e7c8 0%,#eadcb6 100%);--ink:#54462e;--tint:#e6cf9a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow:hidden;color:var(--ink);background:#e8d4c6;
  font-family:var(--font-body,"LXGW WenKai","霞鹜文楷","Songti SC",serif)}
.wallbg{position:fixed;left:0;top:0;right:0;bottom:0;background:var(--wall);background-size:cover}
/* 氛围滤镜：罩在房间上，让整幅画随主题一起染上色调 */
.hs-tint{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:10;
  background:var(--tint);mix-blend-mode:multiply;opacity:.16;transition:background .6s ease}
/* 画面：390×720 的插画，底部对齐；整体微微歪一点，像随手拍的 */
.hs-stage{position:fixed;left:50%;bottom:0;width:min(100vw,calc(100vh*.5417));height:calc(min(100vw,calc(100vh*.5417))*1.846);
  margin-left:calc(min(100vw,calc(100vh*.5417))/-2);transform:rotate(-2.4deg) scale(1.1);transform-origin:50% 62%}
.hs-stage svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.hs-front{pointer-events:none}
.hs-fx,.hs-dy,.hs-veil,.hs-ns{will-change:opacity}
.hs-fx,.hs-veil,.hs-ns{opacity:0}
/* 夜色：HTML 层，中间留台灯一圈暖光；box-shadow 把画面以外也一并压暗 */
.hs-veil{position:absolute;left:-60%;top:-60%;width:220%;height:220%;pointer-events:none;box-shadow:0 0 0 200vmax rgba(12,14,38,.94);background:radial-gradient(circle farthest-corner at 51% 46.2%,rgba(34,30,68,.6) 0,rgba(22,24,58,.8) 30%,rgba(15,17,46,.9) 60%,rgba(12,14,38,.94) 100%)}
.hs-stk{color:#8a6a58;opacity:.62;transition:color .9s,opacity .9s}
.hs-stk *{fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
html[data-night] .hs-stk{color:#d6dcec;opacity:.42}
.hs-mult{mix-blend-mode:multiply}
.rp{opacity:0;transform-box:fill-box;transform-origin:0 50%;fill:none;stroke:#c97d68;stroke-width:1.6;stroke-linecap:round}
.playing .rp{animation:rp 2.6s ease-out infinite}.playing .r2{animation-delay:.45s}.playing .r3{animation-delay:.9s}
@keyframes rp{0%{opacity:0;transform:scale(.6)}25%{opacity:.85}100%{opacity:0;transform:scale(1.4)}}
.steam{fill:none;stroke:#fff;stroke-width:1.3;stroke-linecap:round;opacity:.6;animation:st 4s ease-in-out infinite}
@keyframes st{50%{transform:translateY(-3px);opacity:.25}}
.hs-star{animation:tw var(--d) ease-in-out var(--l) infinite}
@keyframes tw{50%{opacity:.25}}
#playBtn{cursor:pointer;outline:none}#playBtn:focus-visible .hit{stroke:#c97d68;stroke-width:2}
.hit{fill:transparent}

/* 顶栏：‹ 回去 / 标题 / 两个小开关（挑歌、暗夜） */
.hs-bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 6px}
.hs-bar a{all:unset;cursor:pointer;min-width:72px;height:40px;display:inline-flex;align-items:center;font-size:15px;color:var(--ink)}
.hs-bar h1{margin:0;font-size:18px;font-weight:500;letter-spacing:.14em;color:var(--ink)}
.hs-tools{min-width:72px;display:flex;justify-content:flex-end;gap:4px}
.hs-ib{all:unset;cursor:pointer;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink);transition:background .3s}
.hs-ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hs-ib.hs-on{background:rgba(201,125,104,.22)}
.hs-nb .hs-su{display:none}html[data-night] .hs-nb .hs-su{display:block}html[data-night] .hs-nb .hs-mo{display:none}
.hs-ib:focus-visible,.hs-bar a:focus-visible{outline:2px solid #c97d68;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body[data-music="none"] .music-house-link, body[data-music="none"] .music-note { display: none; }

/* ===== 主题选择：底部抽屉 ===== */
.theme-panel{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:220;display:none}
.theme-panel.on{display:block}
.theme-panel__sheet{position:absolute;left:0;right:0;bottom:0;background:rgba(255,252,246,.97);
  border-radius:24px 24px 0 0;border-top:2px solid var(--ink,#4a3a35);
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-sizing:border-box;
  animation:tp-up .3s cubic-bezier(.22,.8,.3,1)}
@keyframes tp-up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.theme-panel__head{display:flex;align-items:center;justify-content:space-between;font-size:18px;letter-spacing:.15em;color:var(--ink);margin-bottom:14px}
.theme-panel__head button{all:unset;cursor:pointer;font-size:15px;line-height:1;color:var(--ink,#4a3a35);letter-spacing:.08em;padding:8px 6px}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.theme-card{border:2px solid transparent;border-radius:14px;padding:10px;cursor:pointer;background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.06);transition:border-color .2s,transform .12s}
.theme-card.on{border-color:var(--ink,#4a3a35)}
.theme-card:active{transform:scale(.97)}
.theme-card__sw{height:56px;border-radius:9px;margin-bottom:8px}
.theme-card__name{font-size:14px;color:var(--ink);letter-spacing:.08em;text-align:center}
</style>

<script>
(function(){
  var KEY='park.house.dark', root=document.documentElement, NS='http://www.w3.org/2000/svg';
  var $=function(i){return document.getElementById(i)};
  var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
  var say=function(t){if(typeof toast==='function')toast(t)};
  if(window.Park&&Park.session)Park.session().then(function(s){if(!s)location.replace('login.html')});


  function el(p,t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}

  /* 书架：画在向右退远的左墙上，近大远小、线条向地平线收拢 */
  var sh=$('shelf'),C=['#a9b8c6','#e3b8a5','#f0dfba','#9aa58c','#cdbfd8','#d98f78','#3a3d45'];
  function P(x,yn){return [x,300+(yn-300)*(1-.0046*x)]}
  function quad(x1,x2,y1,y2,fill){var a=P(x1,y1),b=P(x2,y1),c=P(x2,y2),d=P(x1,y2);
    return el(sh,'polygon',{points:[a,b,c,d].join(' '),fill:fill})}
  function bk(x,w,yb,h,c){quad(x,x+w,yb-h,yb,C[c])}
  quad(8,100,30,520,'#d9c3b4');
  [[6,78,0],[5,92,6],[7,66,2],[6,84,1],[5,74,4]].forEach(function(b,i){var x=14+[0,7,13,21,28][i];bk(x,b[0],150,b[1],b[2])});
  quad(60,88,92,150,'#f7eee3');quad(64,84,100,142,'#e8b9a2');
  quad(14,46,258,270,C[1]);quad(17,43,246,258,C[0]);var o=P(30,226);el(sh,'circle',{cx:o[0],cy:o[1],r:7,fill:'#f7eee3'});
  [[5,70,3],[6,60,5],[5,76,4]].forEach(function(b,i){bk(52+i*8,b[0],270,b[1],b[2])});
  var pp=P(86,270);quad(80,92,246,270,'#e8b9a2');el(sh,'path',{d:'M'+pp[0]+' '+(pp[1]-14)+'q-4-12 2-20M'+pp[0]+' '+(pp[1]-14)+'q8-8 12-8',stroke:'#9aa58c','stroke-width':1.6,fill:'none'});
  for(var i=0;i<6;i++)bk(14+i*6,4,390,74,[0,1,2,4,5,3][i]);
  quad(54,68,364,390,'#cdbfd8');quad(78,92,368,390,'#f7eee3');
  quad(14,46,470,510,'#d6b88c');quad(52,92,478,510,'#c9a97c');var cc=P(70,454);el(sh,'circle',{cx:cc[0],cy:cc[1],r:8,fill:'#f3efe9'});
  [30,150,270,390,510].forEach(function(y){quad(6,102,y,y+7,'#8c6a50')});
  quad(6,10,30,520,'#8c6a50');quad(98,102,30,520,'#8c6a50');

  /* 前景右下角的大叶子 */
  var pl=$('plant'),L=[[-58,.8,'#9aa58c'],[-30,1,'#b3bc9f'],[-6,1.15,'#8c9c80'],[22,.9,'#a4b398']];
  pl.setAttribute('transform','translate(384 724)');
  el(pl,'path',{d:'M-20 0h40l-5 36h-30z',fill:'#d98f78'});
  L.forEach(function(l){el(pl,'path',{d:'M0 -2C-16 -22 -13 -62 0 -92C13 -62 16 -22 0 -2Z',fill:l[2],transform:'rotate('+l[0]+') scale('+l[1]+')'})});

  /* 夜里浮现的小星星（窗里） */
  var st=$('stars');
  for(var j=0;j<9;j++)el(st,'circle',{class:'hs-star',cx:156+Math.random()*80,cy:164+Math.random()*100,r:1+Math.random()*.6,style:'--d:'+(3+Math.random()*3)+'s;--l:'+(Math.random()*3)+'s'});

  /* 播放器：只调用全局 window.Music，不新建 Audio */
  var back=$('back'),btn=$('playBtn'),note=$('noteBtn');
  function render(s){var p=!!(s&&s.playing);back.classList.toggle('playing',p);note.classList.toggle('hs-on',p)}
  function ready(){if(window.Music)return true;say('音乐还没准备好，稍等一下');return false}
  function tog(){if(ready())Music.toggle()}
  btn.addEventListener('click',tog);
  btn.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();tog()}});
  note.addEventListener('click',function(){if(ready())Music.open()});
  if(window.Music){Music.onChange(render);render({playing:Music.isPlaying()})}

  /* ===== 主题切换：换氛围 ===== */
  var THEME_KEY='park.house.theme', THEMES=['default','peach','mint','dusk','cream'];
  var tp=$('themePanel'), tb=$('themeBtn');
  function curTheme(){var t=root.getAttribute('data-theme');return THEMES.indexOf(t)>=0?t:'default'}
  function paint(t){
    if(t==='default')root.removeAttribute('data-theme');else root.setAttribute('data-theme',t);
    try{localStorage.setItem(THEME_KEY,t)}catch(e){}
    var cs=$$('.theme-card');for(var i=0;i<cs.length;i++)cs[i].classList.toggle('on',cs[i].getAttribute('data-theme')===t);
  }
  function openTheme(){tp.classList.add('on');paint(curTheme())}
  function closeTheme(){tp.classList.remove('on')}
  tb.addEventListener('click',openTheme);
  $$('.theme-card').forEach(function(c){c.addEventListener('click',function(){paint(c.getAttribute('data-theme'))})});
  $$('.theme-close').forEach(function(b){b.addEventListener('click',function(){closeTheme();try{say('氛围换好啦')}catch(e){}})});
  tp.addEventListener('click',function(e){if(!e.target.closest('.theme-panel__sheet'))closeTheme()});
  paint(curTheme());
})();
</script>
