<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>银行 · 给聆遇的游乐园</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌙%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/base.css?v=2026102410">
  <style>
    body { min-height: 100vh; margin: 0; background: linear-gradient(180deg, #fff8e1 0%, #fdeaf0 52%, #e6f1ff 100%); color: #222; display: flex; flex-direction: column; align-items: center; }
    .top { width: calc(100% - 32px); max-width: 480px; display: flex; align-items: center; justify-content: space-between; margin-top: 20px; }
    .top a { color: #222; text-decoration: none; font-size: 16px; }
    .top h1 { font-size: 22px; font-weight: normal; letter-spacing: .2em; margin: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.05; }
    .top h1 small { font-family: Georgia, "Times New Roman", serif; font-size: 8.5px; font-weight: normal; letter-spacing: .3em; color: #bda994; margin-top: 4px; margin-right: -.3em; }

    .bal { margin-top: 36px; width: calc(100% - 64px); max-width: 420px; background: rgba(255,255,255,.74); border: 1.5px solid rgba(122,92,72,.16); border-radius: 24px; padding: 30px 22px 22px; text-align: center; box-shadow: 0 10px 30px rgba(180,150,120,.16); box-sizing: border-box; }
    .bal .lb { font-size: 13px; letter-spacing: .34em; color: #b08a3d; }
    .bal .num { font-family: Georgia, "Songti SC", "STSong", serif; font-size: 58px; line-height: 1.12; margin-top: 4px; color: #6b5120; letter-spacing: .01em; display: inline-block; }
    @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
    .bal .num.pop { animation: pop .7s ease; }

    .ckrow { margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .ckdays { font-size: 11.5px; color: #b3a394; letter-spacing: .08em; }
    .ckdays i { font-style: normal; font-size: 10px; letter-spacing: .03em; opacity: .6; margin-left: 4px; }
    .ckbtn { font: inherit; font-size: 12.5px; letter-spacing: .2em; color: #a8874a; background: transparent; border: 1px solid rgba(168,136,74,.38); border-radius: 999px; padding: 5px 17px 5px 19px; cursor: pointer; transition: background .2s ease, color .2s ease, border-color .2s ease; -webkit-tap-highlight-color: transparent; }
    .ckbtn:active { background: rgba(255,236,180,.42); }
    .ckbtn.done { color: #c2b5a7; border-color: rgba(0,0,0,.08); cursor: default; }

    .acts { width: calc(100% - 64px); max-width: 420px; margin-top: 14px; display: flex; gap: 10px; }
    .act { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 13px 4px 11px; background: rgba(255,255,255,.6); border: 1px solid rgba(122,92,72,.14); border-radius: 18px; color: #6d5a48; text-decoration: none; font: inherit; cursor: pointer; transition: background .2s ease, transform .18s ease; -webkit-tap-highlight-color: transparent; }
    .act:active { background: rgba(255,255,255,.94); transform: scale(.975); }
    .act svg { width: 18px; height: 18px; color: #b08a3d; }
    .act span { font-size: 12px; letter-spacing: .14em; }

    .mask { position: fixed; inset: 0; z-index: 50; background: rgba(46,32,20,.26); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .sheet { width: 100%; max-width: 480px; background: linear-gradient(180deg, #fffdf8, #fff6ec); border-radius: 26px 26px 0 0; padding: 22px 24px calc(24px + env(safe-area-inset-bottom)); box-shadow: 0 -12px 40px rgba(120,90,60,.2); animation: up .26s cubic-bezier(.2,.8,.2,1); box-sizing: border-box; }
    @keyframes up { from { transform: translateY(44px); opacity: .5; } to { transform: none; opacity: 1; } }
    .sheet .sh { display: flex; align-items: center; justify-content: space-between; }
    .sheet .sh b { font-weight: normal; font-size: 15px; letter-spacing: .22em; color: #7a6552; }
    .sheet .sh button { border: none; background: none; font-size: 22px; line-height: 1; color: #c0b1a2; cursor: pointer; padding: 0 2px; }
    .sheet label { display: block; margin-top: 20px; font-size: 11.5px; letter-spacing: .16em; color: #a89684; }
    .sheet input { width: 100%; margin-top: 7px; padding: 8px 2px; font: inherit; font-size: 15px; color: #4b3a2e; background: transparent; border: none; border-bottom: 1px solid rgba(122,92,72,.22); border-radius: 0; outline: none; box-sizing: border-box; }
    .sheet input:focus { border-bottom-color: rgba(176,138,61,.72); }
    .sheet input::placeholder { color: #d2c7ba; font-size: 13px; letter-spacing: .03em; }
    .sheet .go { display: block; margin: 28px auto 0; padding: 11px 34px 11px 37px; font: inherit; font-size: 13.5px; letter-spacing: .24em; color: #6f5a45; background: #fff; border: 1px solid rgba(122,92,72,.2); border-radius: 999px; cursor: pointer; box-shadow: 0 5px 16px rgba(140,115,90,.14); transition: transform .18s ease, background .2s ease, box-shadow .2s ease, opacity .2s ease; }
    .sheet .go:active { transform: scale(.97); background: #fdfbf8; box-shadow: 0 2px 8px rgba(140,115,90,.12); }
    .sheet .go:disabled { opacity: .6; box-shadow: none; }
    .sheet .hint { margin-top: 15px; font-size: 11px; color: #b8aa9a; letter-spacing: .05em; text-align: center; line-height: 1.75; }

    .sect { width: calc(100% - 64px); max-width: 420px; margin-top: 34px; display: flex; align-items: center; gap: 10px; }
    .sect b { font-weight: normal; font-size: 14.5px; letter-spacing: .18em; color: #7a6552; white-space: nowrap; }
    .sect i { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(122,101,82,.26), transparent); }

    .list { width: calc(100% - 64px); max-width: 420px; margin-top: 6px; }
    .item { display: flex; justify-content: space-between; align-items: center; padding: 14px 2px; border-bottom: 1px dashed rgba(0,0,0,.08); }
    .item:last-child { border-bottom: none; }
    .item .l { display: flex; flex-direction: column; gap: 3px; }
    .item .l .n { font-size: 14.5px; color: #4b3a2e; }
    .item .l .t { font-size: 11.5px; color: #a89684; letter-spacing: .06em; }
    .item .r { font-family: Georgia, "Songti SC", serif; font-size: 18px; }
    .item .r.plus { color: #3f8f6a; }
    .item .r.minus { color: #c2635f; }

    .intr { margin-top: 11px; display: flex; align-items: baseline; justify-content: center; gap: 9px; font-size: 11px; color: #b0a094; letter-spacing: .07em; }
    .intr i { font-style: normal; color: #a8874a; }

    .empty { padding: 40px 0 34px; text-align: center; color: #b0a094; font-size: 14px; line-height: 2.1; letter-spacing: .08em; }

    .foot { margin-top: auto; padding: 40px 0 26px; color: #ab9a8b; font-size: 12.5px; letter-spacing: .07em; text-align: center; max-width: 400px; line-height: 2; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="top"><a href="me.html">‹ 回去</a><h1>银行<small>MOONLIGHT BANK</small></h1><span style="width:48px"></span></div>

  <div class="bal">
    <div class="lb">月光币</div>
    <div class="num" id="bal">—</div>
    <div class="ckrow">
      <button class="ckbtn" id="ckBtn" type="button">签到</button>
      <span class="ckdays" id="ckDays" hidden></span>
    </div>
    <div class="intr" id="intr" hidden>
      <span id="intrRate">日利率 0.01%</span>
      <i id="intrGain"></i>
    </div>
  </div>

  <div class="acts">
    <button class="act" id="actTransfer" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13"/><path d="M14 6l3 3-3 3"/><path d="M20 15H7"/><path d="M10 12l-3 3 3 3"/></svg>
      <span>转账</span>
    </button>
    <a class="act" href="invest.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M3 10.5h18"/><path d="M7 14.5h4.5"/></svg>
      <span>投资卡</span>
    </a>
    <a class="act" href="market.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18.5V5.5"/><path d="M4 18.5h16"/><path d="M7.5 14.8l3.6-4.2 3 2.6 3.6-5.1"/></svg>
      <span>市场</span>
    </a>
  </div>

  <div class="mask" id="mask" hidden>
    <div class="sheet">
      <div class="sh"><b>转 账</b><button id="shClose" type="button">×</button></div>
      <label for="tName">对方昵称</label>
      <input id="tName" type="text" autocomplete="off">
      <label for="tUid">对方 ID</label>
      <input id="tUid" type="text" autocomplete="off" spellcheck="false">
      <label for="tAmt">数额</label>
      <input id="tAmt" type="text" inputmode="numeric" autocomplete="off">
      <button class="go" id="tGo" type="button">转过去</button>
      <div class="hint">转账有风险，谨防受骗。</div>
    </div>
  </div>

  <div class="sect"><b>流水</b><i></i></div>
  <div class="list" id="list"><div class="empty">正在打开账本…</div></div>

  <div class="foot">圆圆的黄硬币，想拿走<br>给你夹娃娃</div>

  <script src="assets/js/common.js?v=2026100802"></script>
  <script src="assets/js/auth.js?v=2026100802"></script>
  <script>
    (async function () {
      const $ = id => document.getElementById(id);
      const say = m => (typeof toast === 'function' ? toast(m) : console.log(m));
      const s = await Park.session();
      if (!s) return location.replace('login.html');

      let uid = '';
      try {
        const p = atob(s.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'));
        uid = JSON.parse(p).sub || '';
      } catch (e) {}

      const p2 = n => String(n).padStart(2, '0');
      const fmt = iso => {
        const d = new Date(iso);
        if (isNaN(d)) return '';
        return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
      };

      let busy = false;

      const trimNum = v => {
        const n = Number(v);
        if (!isFinite(n)) return '0';
        if (Number.isInteger(n)) return String(n);
        return String(Number(n.toFixed(4)));
      };

      function setBal(v) {
        const el = $('bal');
        el.textContent = trimNum(v);
        const len = el.textContent.length;
        el.style.fontSize = len > 12 ? '26px' : (len > 8 ? '36px' : '');
      }

      function renderStatus(st) {
        if (!st) return;
        setBal(st.balance);
        const days = Number(st.streak) || 0;
        const cyc = Number(st.cycle) || ((days - 1) % 10 + 1);
        const dEl = $('ckDays');
        if (days > 0) {
          dEl.hidden = false;
          dEl.innerHTML = '已连签 ' + days + ' 天<i>' + (cyc > 0 ? cyc : 1) + '/10</i>';
        } else {
          dEl.hidden = true;
          dEl.textContent = '';
        }
        const btn = $('ckBtn');
        if (st.checked_today) {
          btn.textContent = '今日已签';
          btn.disabled = true;
          btn.classList.add('done');
        } else {
          btn.textContent = '签到';
          btn.disabled = false;
          btn.classList.remove('done');
        }
      }

      async function loadStatus() {
        try {
          const r = await Park.api('rpc/checkin_status', { method: 'POST', body: '{}' });
          const st = r.ok ? await r.json() : null;
          if (st && st.ok) { renderStatus(st); return; }
          const r2 = await Park.api('profiles?select=moon_coins&id=eq.' + uid);
          const me = r2.ok ? (await r2.json())[0] : null;
          if (me) setBal(me.moon_coins ?? 0); else $('bal').textContent = '—';
        } catch (e) {
          $('bal').textContent = '—';
        }
      }

      // 每天第一次打开银行，把前一天的利息结掉（服务端幂等，一天只结一次）
      async function tickInterest() {
        try {
          const r = await Park.api('rpc/bank_tick', { method: 'POST', body: '{}' });
          const t = r.ok ? await r.json() : null;
          if (!t || !t.ok) return;
          setBal(t.bal);
          const g = Number(t.gain) || 0;
          const rate = (Number(t.rate) || 0) * 100;
          $('intr').hidden = false;
          $('intrRate').textContent = '日利率 ' + rate.toFixed(2) + '%';
          const next = Number(t.bal) * (Number(t.rate) || 0);   // 明天能拿多少
          // 只说实话：真加了钱才显示「+多少 · N 天」，否则一律显示「明天 +多少」
          $('intrGain').textContent = g > 0
            ? '+' + trimNum(g) + ' · ' + t.days + ' 天，明天再 +' + trimNum(next)
            : '明天 +' + trimNum(next);
        } catch (e) {}
      }

      async function loadLedger() {
        const list = $('list');
        try {
          const r = await Park.api('rpc/moon_ledger_list', { method: 'POST', body: '{}' });
          const rows = r.ok ? await r.json() : null;
          if (!Array.isArray(rows)) throw new Error('bad');
          if (!rows.length) {
            list.innerHTML = '<div class="empty">这里还没有流水<br>月光币还安安静静躺着</div>';
            return;
          }
          list.innerHTML = '';
          rows.forEach(x => {
            const el = document.createElement('div'); el.className = 'item';
            const l = document.createElement('div'); l.className = 'l';
            const n = document.createElement('span'); n.className = 'n';
            n.textContent = x.reason || (Number(x.delta) >= 0 ? '收到月光币' : '花掉月光币');
            const t = document.createElement('span'); t.className = 't'; t.textContent = fmt(x.created_at);
            l.appendChild(n); l.appendChild(t);
            const rr = document.createElement('div');
            const dv = Number(x.delta) || 0;
            rr.className = 'r ' + (dv >= 0 ? 'plus' : 'minus');
            rr.textContent = (dv >= 0 ? '+' : '−') + trimNum(Math.abs(dv));
            el.appendChild(l); el.appendChild(rr);
            list.appendChild(el);
          });
        } catch (e) {
          list.innerHTML = '<div class="empty">账本暂时打不开<br>过一会儿再来看看</div>';
        }
      }

      $('ckBtn').onclick = async () => {
        if (busy || $('ckBtn').disabled) return;
        busy = true;
        $('ckBtn').disabled = true;
        try {
          const r = await Park.api('rpc/daily_checkin', { method: 'POST', body: '{}' });
          const res = r.ok ? await r.json() : null;
          if (res && res.ok) {
            setBal(res.balance);
            const num = $('bal');
            num.classList.remove('pop');
            void num.offsetWidth;
            num.classList.add('pop');
            say('+' + trimNum(res.reward) + ' 月光币');
            await loadLedger();
          } else {
            say((res && res.msg) ? res.msg : '稍后再试');
          }
        } catch (e) {
          say('稍后再试');
        } finally {
          busy = false;
          await loadStatus();
        }
      };

      $('actTransfer').onclick = () => { $('mask').hidden = false; };
      $('shClose').onclick = () => { $('mask').hidden = true; };
      $('mask').addEventListener('click', e => { if (e.target === $('mask')) $('mask').hidden = true; });

      $('tGo').onclick = async () => {
        const name = $('tName').value.trim();
        const to = $('tUid').value.trim();
        const raw = $('tAmt').value.trim();
        if (!name) return say('要填对方的昵称');
        if (!/^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/.test(to))
          return say('ID 看起来不太对');
        if (!/^\d+(\.\d+)?$/.test(raw)) return say('数额要填数字');
        const amt = Number(raw);
        if (!(amt > 0)) return say('数额要大于 0');
        if (busy) return;
        busy = true;
        $('tGo').disabled = true;
        $('tGo').textContent = '转…';
        try {
          const r = await Park.api('rpc/moon_transfer', {
            method: 'POST',
            body: JSON.stringify({ p_to: to, p_nickname: name, p_amount: amt })
          });
          const res = r.ok ? await r.json() : null;
          if (res && res.ok) {
            $('mask').hidden = true;
            $('tName').value = ''; $('tUid').value = ''; $('tAmt').value = '';
            setBal(res.balance);
            const num = $('bal');
            num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop');
            say('转给 ' + res.to + ' ' + trimNum(res.amount) + ' 枚');
            await loadLedger();
          } else {
            say((res && res.msg) ? res.msg : '稍后再试');
          }
        } catch (e) {
          say('稍后再试');
        } finally {
          busy = false;
          $('tGo').disabled = false;
          $('tGo').textContent = '转过去';
          await loadStatus();
        }
      };

      await loadStatus();
      await tickInterest();
      await loadLedger();
    })();
  </script>
</body>
</html>
