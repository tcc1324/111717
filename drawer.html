<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<title>秘密抽屉 · 聆遇游乐园</title>
<link rel="stylesheet" href="assets/css/base.css?v=2026100802">
<script src="assets/js/common.js?v=2026100802"></script>
<script src="assets/js/auth.js?v=2026100802"></script>
<style>
:root{
  --paper:#f9f3e8;--cream:#fdf9f1;--line:rgba(122,92,72,.62);--ink:#5a463b;--soft:#a58d7d;
  --oat:#eadcc4;--blush:#f1d8cf;--butter:#f4e8c1;--in:#e3d2b8;
  --kai:var(--font-body,"LXGW WenKai","霞鹜文楷","Kaiti SC","KaiTi",serif);
  --ttl:"Smiley Sans","得意黑",var(--kai);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font-family:var(--kai);
  background:radial-gradient(90% 60% at 50% 0%,#fbf4e6,transparent 70%),#f2e8d7;
  padding:max(14px,env(safe-area-inset-top)) 14px max(40px,env(safe-area-inset-bottom))}
.sheet{position:relative;max-width:520px;margin:12px auto 0;padding:26px 20px 34px;background:var(--paper);border-radius:3px;
  box-shadow:0 1px 0 #fff inset,0 2px 3px rgba(122,92,72,.12),0 22px 40px rgba(122,92,72,.14)}
.sheet::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:3px;
  background:linear-gradient(transparent 49.7%,rgba(122,92,72,.09) 49.85%,rgba(255,255,255,.7) 50.1%,transparent 50.4%)}
.view{position:relative}
.back{font:inherit;font-size:13px;color:var(--soft);background:none;border:0;padding:0;cursor:pointer;letter-spacing:.08em}
h1{margin:12px 0 2px;font-family:var(--ttl);font-weight:400;font-size:26px;letter-spacing:.3em}
.en{margin:0 0 6px;font-size:12px;color:var(--soft);letter-spacing:.32em;opacity:.72}
.sub{margin:8px 0 8px;font-size:13px;color:var(--soft);letter-spacing:.08em}
.note{margin:0 0 24px;font-size:11px;line-height:1.8;color:var(--soft);opacity:.62;letter-spacing:.04em}
.newing .note{display:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #9b7f6c;outline-offset:3px}
.slip input[type=text]:focus,.slip input[type=text]:focus-visible{outline:none}
.card textarea:focus,.card textarea:focus-visible{outline:none}

/* 合着的纸盒抽屉 */
.dlist{display:grid;gap:26px}
.dbox{position:relative;display:block;width:100%;height:104px;padding:0;border:0;background:none;cursor:pointer;
  font:inherit;color:inherit;text-align:left;-webkit-tap-highlight-color:transparent}
.dbox .in{position:absolute;left:7px;right:7px;top:0;height:16px;background:var(--in);border:1.5px solid var(--line);
  border-bottom:0;border-radius:6px 7px 0 0;overflow:hidden;transition:height .45s cubic-bezier(.3,.8,.25,1)}
.dbox .in::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:60%;border-radius:3px 3px 0 0;
  background:repeating-linear-gradient(90deg,var(--cream) 0 22px,transparent 22px 30px)}
.face{position:absolute;left:0;right:0;top:14px;bottom:0;border:1.5px solid var(--line);
  border-radius:7px 9px 8px 6px/9px 7px 8px 7px;background:var(--tone,var(--oat));
  box-shadow:0 8px 14px rgba(122,92,72,.12);transition:transform .45s cubic-bezier(.3,.8,.25,1),box-shadow .45s}
.dbox:hover .face,.dbox:focus-visible .face,.dbox.pulled .face{transform:translateY(16px);box-shadow:0 14px 20px rgba(122,92,72,.16)}
.dbox:hover .in,.dbox:focus-visible .in,.dbox.pulled .in{height:34px}
.slot{position:absolute;left:50%;top:12px;width:38px;height:8px;margin-left:-19px;border:1.5px solid var(--line);
  border-radius:8px;background:rgba(122,92,72,.14)}
.lab{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:72%;padding:8px 6px;text-align:center;
  background:var(--cream);border:1px solid rgba(122,92,72,.35);border-radius:3px}
.lab b{display:block;font-family:var(--ttl);font-weight:400;font-size:16px;letter-spacing:.2em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lab small{display:block;margin-top:2px;font-size:11px;color:var(--soft);letter-spacing:.05em}
.dbox.add .face{background:transparent;border-style:dashed;box-shadow:none;transform:none!important}
.dbox.add .in{display:none}
.dbox.add .lab{background:transparent;border:0;color:var(--soft)}
.dbox.pv{pointer-events:none;cursor:default}
/* 拉开后的抽屉 */
.tray .reveal{display:grid;grid-template-rows:0fr;transition:grid-template-rows .8s cubic-bezier(.3,.8,.25,1)}
.tray.opened .reveal{grid-template-rows:1fr}
.reveal>div{min-height:0;overflow:hidden}
.inside{margin:0 7px;padding:14px 12px 20px;min-height:40px;background:linear-gradient(var(--in),#ecdfca);
  border:1.5px solid var(--line);border-bottom:0;border-radius:7px 8px 0 0;box-shadow:inset 0 12px 16px rgba(122,92,72,.16)}
.tabs{display:flex;gap:18px;justify-content:center;margin:2px 0 14px}
.tab{font:inherit;font-size:14px;letter-spacing:.2em;background:none;border:0;color:var(--soft);padding:4px 2px 6px;
  cursor:pointer;border-bottom:1.5px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--line)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px}
.it{position:relative;width:100%;min-height:98px;padding:10px 10px 8px;background:var(--cream);
  border:1px solid rgba(122,92,72,.38);border-radius:3px;font:inherit;font-size:13px;line-height:1.6;color:inherit;
  text-align:left;cursor:pointer;overflow:hidden;transform:rotate(var(--r,0deg));
  box-shadow:0 3px 6px rgba(122,92,72,.14);transition:transform .25s}
.it:hover{transform:rotate(0) translateY(-3px)}
.it .t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.it small{display:block;margin-top:6px;font-size:11px;color:var(--soft)}
.it.photo{display:flex;flex-direction:column;padding:7px 7px 8px;aspect-ratio:1/1.1}
.it.photo .ph{flex:1;min-height:56px;border-radius:2px;background:linear-gradient(150deg,#f6dccf,#efe0bd)}
.it.diary{padding-left:16px;border-left:7px solid #dfbfb2}
.it.locked{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  color:var(--soft);background:#f6efe2}
.it.locked i{font-style:normal;font-size:20px}
.empty{grid-column:1/-1;text-align:center;color:var(--soft);font-size:13px;letter-spacing:.1em;padding:18px 0}
.addrow{text-align:center;margin-top:18px}
.ghostbtn{font:inherit;font-size:13px;letter-spacing:.14em;color:var(--ink);background:transparent;
  border:1.5px dashed var(--line);border-radius:999px;padding:8px 18px;cursor:pointer}
.lip{position:relative;height:68px;border:1.5px solid var(--line);border-radius:2px 2px 9px 9px;
  background:var(--tone,var(--oat));box-shadow:0 12px 18px rgba(122,92,72,.14)}
.lip .slot{top:8px}
.lip .lab{top:56%;width:60%}
.lip .shut{position:absolute;left:10px;top:50%;transform:translateY(-50%)}

/* 调色板 */
.pal{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:2px 0 12px}
.palt{text-align:center;font-size:12px;color:var(--soft);letter-spacing:.14em;margin:18px 0 8px}
.sw{position:relative;width:26px;height:26px;padding:0;border-radius:50%;border:1.5px solid var(--line);cursor:pointer}
.sw[aria-checked="true"]{box-shadow:0 0 0 2px var(--cream),0 0 0 3.5px var(--ink)}
.sw.custom{display:grid;place-items:center;font-size:14px;color:var(--soft);
  background:conic-gradient(#f1d8cf,#f4e8c1,#dfe6d3,#d8e4ea,#e5dcee,#f1d8cf)}
.sw.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}
@supports (color:color-mix(in srgb,red,blue)){
  .dbox,.tray{--in:color-mix(in srgb,var(--tone,#eadcc4) 72%,#b89572)}
}

/* 新开抽屉：页面里的一张纸条表单（没有浮层，没有固定定位），垂直居中、一屏内放完 */
#vNew{display:flex;flex-direction:column;justify-content:center;min-height:var(--nh,calc(100svh - 230px))}
body.frozen{min-height:var(--bh,100vh)}
html{overflow-anchor:none}
#vNew .dbox{height:78px}
.slip{margin-top:12px;padding:12px 14px 10px;background:var(--cream);border:1.5px solid var(--line);
  border-radius:6px 8px 7px 6px;box-shadow:0 8px 16px rgba(122,92,72,.1)}
.slip h3{margin:0 0 8px;font-family:var(--ttl);font-weight:400;letter-spacing:.2em;font-size:16px}
.card h3{margin:0 0 12px;font-family:var(--ttl);font-weight:400;letter-spacing:.2em;font-size:17px}
.card select{display:block;width:fit-content;margin:12px 0 2px auto;font:inherit;font-size:14px;padding:6px 12px;border:1.5px solid rgba(122,92,72,.45);border-radius:4px;background:#fff9ee;color:var(--ink)}
.slip input[type=text],.slip select{width:100%;font:inherit;font-size:16px;padding:8px 12px;margin-bottom:8px;
  border:1.5px solid rgba(122,92,72,.45);border-radius:4px;background:#fff9ee;color:var(--ink)}
.passin{width:100%;font:inherit;font-size:16px;padding:8px 12px;margin-bottom:8px;
   border:1.5px solid rgba(122,92,72,.45);border-radius:4px;background:#fff9ee;color:var(--ink)}
.secret{-webkit-text-security:disc;text-security:disc}
.timebox{margin:0 0 8px;padding:9px;border:1.5px dashed rgba(122,92,72,.35);border-radius:6px;background:rgba(255,249,238,.55)}
.tseg{display:flex;gap:6px;margin-bottom:8px}
.tbtn{flex:1;font:inherit;font-size:13px;padding:6px 0;border:1.5px solid rgba(122,92,72,.4);border-radius:999px;background:transparent;color:var(--soft);cursor:pointer}
.tbtn.on{background:#8a6a56;color:#fff9f1;border-color:#8a6a56}
.tdur{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--soft)}
.tdur input{width:52px;font:inherit;font-size:15px;padding:6px 4px;text-align:center;border:1.5px solid rgba(122,92,72,.45);border-radius:4px;background:#fff9ee;color:var(--ink)}
.tcal input{width:100%;font:inherit;font-size:15px;padding:8px 10px;border:1.5px solid rgba(122,92,72,.45);border-radius:4px;background:#fff9ee;color:var(--ink)}
.slip label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft);margin:0 0 10px}
.slip .pal{gap:6px;margin:0 0 6px}

/* 查看内容的小浮层（里面没有输入框） */
.mask{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(122,92,72,.28);backdrop-filter:blur(4px)}
.mask.on{display:flex}
.card{width:100%;max-width:340px;background:var(--cream);border:1.5px solid var(--line);
  border-radius:6px 8px 7px 6px;padding:20px 18px 16px;box-shadow:0 24px 50px rgba(122,92,72,.3);animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card .txt{white-space:pre-wrap;line-height:1.9;font-size:15px;max-height:46vh;overflow-y:auto;overflow-x:hidden;margin-bottom:12px;
  min-height:170px;padding:16px 15px;border-radius:3px;overflow-wrap:break-word;word-break:break-word}
.card textarea{width:100%;font:inherit;font-size:15px;line-height:1.7;padding:10px 12px;margin-bottom:4px;
  border:1.5px solid rgba(122,92,72,.45);border-radius:4px;background:#fff9ee;color:var(--ink);resize:vertical;min-height:96px}
.acts{display:flex;justify-content:flex-end;gap:10px}
.acts.center{justify-content:center}
.btn{font:inherit;font-size:14px;letter-spacing:.14em;color:#fff9f1;background:#8a6a56;border:0;border-radius:999px;padding:9px 20px;cursor:pointer}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 日记本：一本一本的本子 */
.bk{position:relative;display:block;width:100%;aspect-ratio:3/4;padding:0;border:0;background:none;cursor:pointer;font:inherit;color:inherit;text-align:left;transition:transform .25s;-webkit-tap-highlight-color:transparent}
.bk:hover{transform:translateY(-3px)}
.bk .cv{position:absolute;inset:0;background-color:var(--bc,#d9b8a8);border:1.5px solid var(--line);border-radius:3px 8px 8px 3px;box-shadow:0 5px 9px rgba(122,92,72,.2),inset 0 0 0 3px rgba(255,255,255,.12)}
.pt-lines .cv,.pt.pt-lines{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.34) 0 1px,transparent 1px 9px)}
.pt-grid .cv,.pt.pt-grid{background-image:linear-gradient(rgba(255,255,255,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.3) 1px,transparent 1px);background-size:10px 10px}
.pt-dots .cv,.pt.pt-dots{background-image:radial-gradient(rgba(255,255,255,.55) 1.4px,transparent 1.9px);background-size:11px 11px}
.pt-stripe .cv,.pt.pt-stripe{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.3) 0 4px,transparent 4px 10px)}

/* 相册封面纹路 */
.pt-film .cv,.pt.pt-film{
  background-image:
    repeating-linear-gradient(90deg,rgba(255,255,255,.7) 0 5px,transparent 5px 10px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.7) 0 5px,transparent 5px 10px),
    linear-gradient(rgba(60,40,25,.2),rgba(60,40,25,.2)),
    linear-gradient(rgba(60,40,25,.2),rgba(60,40,25,.2));
  background-size:100% 5px,100% 5px,100% 16px,100% 16px;
  background-position:2px 6px,2px calc(100% - 6px),0 0,0 100%;
  background-repeat:repeat-x,repeat-x,no-repeat,no-repeat}
.pt.pt-film{background-size:100% 4px,100% 4px,100% 11px,100% 11px;background-position:1px 4px,1px calc(100% - 4px),0 0,0 100%}

.pt-corners .cv,.pt.pt-corners{
  background-image:
    linear-gradient(135deg,rgba(255,255,255,.62) 50%,transparent 50%),
    linear-gradient(225deg,rgba(255,255,255,.62) 50%,transparent 50%),
    linear-gradient(45deg,rgba(255,255,255,.62) 50%,transparent 50%),
    linear-gradient(315deg,rgba(255,255,255,.62) 50%,transparent 50%);
  background-size:20px 20px;
  background-position:0 0,100% 0,0 100%,100% 100%;
  background-repeat:no-repeat}
.pt.pt-corners{background-size:12px 12px}

.pt-frame .cv{box-shadow:0 5px 9px rgba(122,92,72,.2),inset 0 0 0 7px rgba(255,255,255,.34),inset 0 0 0 8.5px rgba(255,255,255,.58)}
.pt-frame .cv,.pt.pt-frame{
  background-image:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.22));
  background-size:100% 24%;background-position:0 100%;background-repeat:no-repeat}
.pt.pt-frame{box-shadow:inset 0 0 0 4px rgba(255,255,255,.34),inset 0 0 0 5px rgba(255,255,255,.6)}
.pt.pt-frame[aria-checked="true"]{box-shadow:inset 0 0 0 4px rgba(255,255,255,.34),inset 0 0 0 5px rgba(255,255,255,.6),0 0 0 2px var(--cream),0 0 0 3.5px var(--ink)}

.pt-diamond .cv,.pt.pt-diamond{
  background-image:
    repeating-linear-gradient(45deg,rgba(255,255,255,.32) 0 1px,transparent 1px 9px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,.32) 0 1px,transparent 1px 9px)}

.pt-wave .cv,.pt.pt-wave{
  background-image:
    radial-gradient(circle at 50% 0,transparent 0 5px,rgba(255,255,255,.5) 5px 6px,transparent 6px),
    radial-gradient(circle at 50% 0,transparent 0 5px,rgba(255,255,255,.5) 5px 6px,transparent 6px);
  background-size:12px 8px,12px 8px;background-position:0 0,6px 4px}
.bk .sp{position:absolute;left:0;top:0;bottom:0;width:13px;border-radius:3px 0 0 3px;background:linear-gradient(90deg,rgba(60,40,25,.28),rgba(60,40,25,.04));border-right:1.5px dashed rgba(255,255,255,.55)}
.bk::after{content:"";position:absolute;right:15px;top:-1px;bottom:-1px;width:5px;background:rgba(80,55,40,.3)}
.bk .tg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:88%;padding:6px 4px;text-align:center;background:var(--cream);border:1px solid rgba(122,92,72,.35);border-radius:2px;z-index:1}
.bk .tg b{display:block;font-family:var(--ttl);font-weight:400;font-size:12px;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk .tg small{display:block;font-size:10px;color:var(--soft)}
.bk .lk{position:absolute;right:20px;bottom:9px;font-size:14px;z-index:1}
.bk.new .cv{background:transparent;border-style:dashed;box-shadow:none}
.bk.new .sp,.bk.new::after{display:none}
.bk.new .tg{background:transparent;border:0;color:var(--soft);top:50%}
.bk.big{width:96px;margin:0 auto 14px;pointer-events:none}
.pats{display:flex;gap:8px;justify-content:center;margin:2px 0 10px}
.pt{width:38px;height:38px;padding:0;border-radius:6px;border:1.5px solid var(--line);cursor:pointer;background-color:var(--bc,#d9b8a8)}
.pt[aria-checked="true"]{box-shadow:0 0 0 2px var(--cream),0 0 0 3.5px var(--ink)}
.rdtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.rdtop b{font-family:var(--ttl);font-weight:400;letter-spacing:.2em;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leaf{position:relative;min-height:320px;padding:30px 18px 44px 38px;background:#fffdf7;border:1px solid rgba(122,92,72,.4);border-radius:2px 7px 7px 2px;box-shadow:0 8px 16px rgba(122,92,72,.14);overflow:hidden}
.leaf::before{content:"";position:absolute;left:26px;top:0;bottom:0;width:1px;background:rgba(214,140,130,.45)}
.leaf::after{content:"";position:absolute;left:9px;top:0;bottom:0;border-left:2px dashed rgba(122,92,72,.22)}
.leaf.turn{animation:turn .25s ease-out}
@keyframes turn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.pdate{font-size:11px;color:var(--soft);text-align:right;letter-spacing:.1em;margin:-14px 0 6px;min-height:14px}
.ptxt,.leaf textarea{display:block;width:100%;min-height:252px;font:inherit;font-size:15px;line-height:28px;color:var(--ink);white-space:pre-wrap;word-break:break-all;background:repeating-linear-gradient(transparent 0 27px,rgba(122,92,72,.16) 27px 28px);background-attachment:local}
.leaf textarea{border:0;outline:none;resize:none;padding:0;height:252px;background-color:transparent}
.ptxt.blank{color:var(--soft)}
.ptxt.cap{background:none;min-height:0;font-size:14px;line-height:1.8}
.albph{display:block;width:100%;margin:0 0 10px}
.albph .albimg{display:block;max-width:100%;max-height:56vh;margin:0 auto;border-radius:3px;object-fit:contain;box-shadow:0 3px 8px rgba(122,92,72,.12);cursor:zoom-in}
.phprev{display:block;max-width:100%;max-height:56vh;margin:0 auto;object-fit:contain;border-radius:3px;box-shadow:0 3px 8px rgba(122,92,72,.12)}
#mLb{display:none;align-items:center;justify-content:center;padding:24px;background:rgba(18,12,8,.85);cursor:zoom-out}
#mLb.on{display:flex}
#mLb img{max-width:100%;max-height:92vh;object-fit:contain;border-radius:3px}
.pno{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;color:var(--soft);letter-spacing:.3em}
.rdnav{display:flex;align-items:center;justify-content:space-between;margin:12px 4px 4px;font-size:12px;color:var(--soft);letter-spacing:.14em}
.rdnav .back[disabled]{opacity:.3;cursor:default}
.rdact{margin-top:14px}
.rdact .btn{padding:7px 14px;font-size:13px;letter-spacing:.1em}
.btn.del{color:#b06a5a;box-shadow:inset 0 0 0 1.5px #cf9c8b;margin-right:auto}
.btn.del.arm{background:#c07868;color:#fff9f1;box-shadow:none}
.back.arm{background:#c07868;color:#fff9f1;border-radius:5px;padding:3px 8px}
/* 纸条纸纹：印在彩纸上，纸色由 --pc 决定 */
.np{--pl:rgba(255,255,255,.55);--pd:rgba(122,92,72,.2);--ps:rgba(255,255,255,.5);background-color:var(--pc,#fdf9f1)}
@supports (color:color-mix(in srgb,red,blue)){
  .np{--ps:color-mix(in srgb,var(--pc,#fdf9f1) 48%,#fff)}
}
.np.np-petal{background-image:
  radial-gradient(circle at 18px 18px,var(--pd) 0 1.6px,transparent 2px),
  radial-gradient(circle at 18px 12px,var(--pl) 0 3.4px,transparent 3.8px),
  radial-gradient(circle at 24px 18px,var(--pl) 0 3.4px,transparent 3.8px),
  radial-gradient(circle at 18px 24px,var(--pl) 0 3.4px,transparent 3.8px),
  radial-gradient(circle at 12px 18px,var(--pl) 0 3.4px,transparent 3.8px),
  radial-gradient(circle at 5px 5px,var(--pl) 0 1.2px,transparent 1.6px);
  background-size:36px 36px}
.np.np-star{background-image:
  radial-gradient(circle at 5px 7px,var(--pl) 0 1.2px,transparent 1.8px),

<script>
(function(){
  if(window.Park&&Park.session) Park.session().then(function(s){ if(!s) location.replace('login.html'); });

  async function rpc(name,args){
    try{
      const r=await Park.api('rpc/'+name,{method:'POST',body:JSON.stringify(args||{})});
      if(!r.ok) return {err:'出了点小问题，稍后再试'};
      return {data:await r.json()};
    }catch(e){ return {err:'网络不太好，稍后再试'}; }
  }

  /* ===== E2EE 端到端加密（Web Crypto，明文/口令/密钥绝不上传）===== */
  const _SENTINEL='drawer-unlock-ok';
  const _te=new TextEncoder(), _td=new TextDecoder();
  function _b64(buf){ const b=new Uint8Array(buf); let s=''; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
  function _unb64(s){ const b=atob(s); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  async function _derive(pass,saltB64){
    const km=await crypto.subtle.importKey('raw',_te.encode(pass),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:_unb64(saltB64),iterations:210000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  }
  async function _seal(plain,key){
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,_te.encode(plain));
    return {iv:_b64(iv),data:_b64(ct)};
  }
  async function _open(dataB64,ivB64,key){
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:_unb64(ivB64)},key,_unb64(dataB64));
    return _td.decode(pt);
  }
  /* 设锁：口令 + 明文 → {salt,nonce,verifier,content}（content 为 iv.密文）*/
  async function lockContent(pass,plain){
    const salt=_b64(crypto.getRandomValues(new Uint8Array(16)));
    const key=await _derive(pass,salt);
    const ver=await _seal(_SENTINEL,key);
    const enc=await _seal(plain,key);
    return {salt:salt, nonce:ver.iv, verifier:ver.data, content:enc.iv+'.'+enc.data};
  }
  /* 解锁：口令 + 元数据 → {data} 或 {err} */
  async function unlockContent(pass,saltB64,nonceB64,verifierB64,contentEnc){
    try{
      const key=await _derive(pass,saltB64);
      const vp=await _open(verifierB64,nonceB64,key);
      if(vp!==_SENTINEL) return {err:'密码/答案不对'};
      const i=contentEnc.indexOf('.');
      const plain=await _open(contentEnc.slice(i+1),contentEnc.slice(0,i),key);
      return {data:plain};
    }catch(e){ return {err:'解不开，口令可能不对'}; }
  }
  /* 只验口令（抽屉无内容，仅校验验证器）*/
  async function verifyPass(pass,saltB64,nonceB64,verifierB64){
    try{
      const key=await _derive(pass,saltB64);
      const vp=await _open(verifierB64,nonceB64,key);
      if(vp!==_SENTINEL) return {err:'密码/答案不对'};
      return {ok:true};
    }catch(e){ return {err:'解不开，口令可能不对'}; }
  }
  /* 有锁的本子写页/撕页后，用已解锁口令重新加密再上传 */
  async function reenc(book,plain){
    if(book._pass && book.lock_salt){
      const key=await _derive(book._pass, book.lock_salt);
      const enc=await _seal(plain,key);
      return enc.iv+'.'+enc.data;
    }
    return plain;
  }

  /* 二进制加密（照片用）：ArrayBuffer → 密文，返回 {iv(base64), data(ArrayBuffer)} */
  async function _sealBytes(buf,key){
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,buf);
    return {iv:_b64(iv), data:ct};
  }
  async function _openBytes(ctBuf,ivB64,key){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:_unb64(ivB64)},key,ctBuf);
  }
  /* 照片的加解密 key：和文字同一个 key（同口令同盐） */
  async function _photoKey(book){
    return _derive(book._pass, book.lock_salt);
  }

  /* 迁移：抽屉有密码/问题锁时，把旧的无锁明文内容用抽屉密码加密回写 */
  async function migrateInherit(){
    if(!cur || !(cur.lock_kind==='password'||cur.lock_kind==='question') || !cur._pass) return;
    const targets=cur.items.filter(it=>it.lock_kind==='none'||it.lock_kind==='inherit'||(it.lock_kind==='time'&&!it.lock_salt));
    if(!targets.length) return;
    const key=await _derive(cur._pass, cur.lock_salt);
    for(const it of targets){
      try{
        if(it.lock_kind==='time' && !it.content) continue; /* 时间锁未到点：服务端还没返回内容，等它到点再迁 */
        const keepTime=it.lock_kind==='time';
        const enc=await _seal(it.content||'', key);
        const content=enc.iv+'.'+enc.data;
        const r=await rpc('drawer_item_relock',{
          p_id:it.id, p_lock_kind:keepTime?'time':cur.lock_kind, p_question:keepTime?(it.question||null):(cur.question||null),
          p_lock_salt:cur.lock_salt, p_lock_nonce:cur.lock_nonce, p_lock_verifier:cur.lock_verifier,
          p_content:content });
        if(r.err || r.data!=='ok') continue;
        it.lock_kind=keepTime?'time':cur.lock_kind;
        it.question=keepTime?(it.question||null):(cur.question||null);
        it.lock_salt=cur.lock_salt; it.lock_nonce=cur.lock_nonce; it.lock_verifier=cur.lock_verifier;
        it.content=content;
        if(it.kind!=='note') it.pages=[];
      }catch(e){}
    }
  }

  function leftTxt(ms){ ms=Math.max(0,ms); const d=Math.floor(ms/DAY), hh=Math.floor(ms%DAY/3600e3), mm=Math.floor(ms%3600e3/60e3);
  if(d>0) return '还有 '+d+' 天 '+hh+' 小时 '+mm+' 分';
  if(hh>0) return '还有 '+hh+' 小时 '+mm+' 分';
  if(mm>0) return '还有 '+mm+' 分钟';
  return '就到时间了'; }

  /* 时间锁：倒计时（天/时/分）与日历（精确到分）二选一 */
  function mountTime(prefix,afterId){
    const box=h('div','timebox'); box.id=prefix+'Time'; box.hidden=true;
    box.innerHTML='<div class="tseg"><button type="button" class="tbtn on" data-m="dur">倒计时</button><button type="button" class="tbtn" data-m="cal">日历</button></div>'
      +'<div class="tdur"><span>天</span><input type="number" id="'+prefix+'D" min="0" max="365" value="0" inputmode="numeric"><span>时</span><input type="number" id="'+prefix+'H" min="0" max="23" value="0" inputmode="numeric"><span>分</span><input type="number" id="'+prefix+'M" min="0" max="59" value="0" inputmode="numeric"></div>'
      +'<div class="tcal" hidden><input type="datetime-local" id="'+prefix+'DT"></div>';
    $(afterId).insertAdjacentElement('afterend',box);
    box.querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>setTimeMode(prefix,b.dataset.m));
  }
  function setTimeMode(prefix,m){
    const box=$(prefix+'Time');
    box.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
    box.querySelector('.tdur').hidden=(m!=='dur');
    box.querySelector('.tcal').hidden=(m!=='cal');
  }
  function resetTime(prefix){
    $(prefix+'D').value=0; $(prefix+'H').value=0; $(prefix+'M').value=0;
    $(prefix+'DT').value=''; setTimeMode(prefix,'dur');
  }
  function computeUnlockAt(prefix){
    const mode=$(prefix+'Time').querySelector('.tbtn.on').dataset.m;
    if(mode==='dur'){
      const d=Math.max(0,+$(prefix+'D').value||0), hh=Math.max(0,+$(prefix+'H').value||0), mm=Math.max(0,+$(prefix+'M').value||0);
      const ms=d*DAY+hh*3600e3+mm*60e3;
      if(ms<=0){ say('设个比 0 长一点的时间吧'); return null; }
      return new Date(now()+ms).toISOString();
    }
    const v=$(prefix+'DT').value;
    if(!v){ say('选个日期和时间吧'); return null; }
    const t=new Date(v).getTime();
    if(isNaN(t)||t<=now()){ say('这个时间已经过去了，选个未来的吧'); return null; }
    return new Date(t).toISOString();
  }

  function setWrite(on,mode){
    wmode=on?mode:null;
    $('ptxt').hidden=on; $('wr').hidden=!on; $('wrActs').hidden=!on; $('rdActs').hidden=on; $('rdnav').hidden=on;
    if(book && book.kind==='photo') $('albph').hidden=on;
    if(!on){ $('phPrev').hidden=true; $('phPrev').src=''; }
  }
  /* 显示相册照片：下载（+解密）后用 img 完整呈现，可点开看大图 */
  async function loadPhoto(p){
    const el=$('albph');
    el.innerHTML='';
    if(!p || !p.img || !p.img.path) return;
    try{
      let data=await storageDownload(p.img.path);
      if(!data) return;
      if(p.img.iv){
        const key=await _photoKey(book);
        data=await _openBytes(data, p.img.iv, key);
      }
      const blob=new Blob([data],{type:p.img.type||'image/jpeg'});
      const url=URL.createObjectURL(blob);
      const img=document.createElement('img');
      img.src=url; img.className='albimg'; img.alt=p.cap||'';
      img.onclick=()=>openLightbox(url);
      el.appendChild(img);
    }catch(e){}
  }
  function openLightbox(url){
    $('lbImg').src=url; $('mLb').classList.add('on');
  }
  $('mLb').onclick=()=>{ $('mLb').classList.remove('on'); $('lbImg').src=''; };
  /* 等比压缩：最长边压到 maxDim、质量 quality、转 jpeg；gif 动图或压缩反而变大时保留原图 */
  async function _compressImage(file, maxDim=1600, quality=0.8){
    if(file.type==='image/gif') return file;
    const url=URL.createObjectURL(file);
    try{
      const img=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('load')); im.src=url; });
      let w=img.naturalWidth, h=img.naturalHeight;
      const max=Math.max(w,h);
      if(max>maxDim){ const k=maxDim/max; w=Math.max(1,Math.round(w*k)); h=Math.max(1,Math.round(h*k)); }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      const blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',quality));
      return (blob && blob.size<file.size)?blob:file;
    }catch(e){
      return file;
    }finally{
      URL.revokeObjectURL(url);
    }
  }
  /* 上传照片：先压缩，有锁则加密，返回 {path, iv?, type} */
  async function uploadPhoto(file){
    const path=book.id+'_'+now()+'_'+Math.random().toString(36).slice(2,8);
    let src=file; try{ src=await _compressImage(file); }catch(e){ src=file; }
    const buf=await src.arrayBuffer();
    const img={path:path, type:src.type||'image/jpeg'};
    let blob;
    if(book._pass && book.lock_salt){
      const key=await _photoKey(book);
      const enc=await _sealBytes(buf,key);
      img.iv=enc.iv;
      blob=new Blob([enc.data],{type:'application/octet-stream'});
    }else{
      blob=new Blob([buf],{type:src.type||'image/jpeg'});
    }
    const ok=await storageUpload(path,blob);
    return ok?img:null;
  }
  function openRead(b){
    book=b; pi=Math.max(0,b.pages.length-1);
    resetArm($('bDel'),b.kind==='photo'?'删掉相册':'删掉日记本');
    $('rdTitle').textContent=b.title; $('wr').placeholder=b.kind==='photo'?'给这张照片写句说明……':'写下今天的事……';
    setWrite(false); renderPage(false);
    show('vRead'); window.scrollTo(0,0);
  }
  $('bDel').onclick=()=>armRun($('bDel'),book.kind==='photo'?'删掉相册':'删掉日记本',async()=>{
    const k=book.kind;
    const photoPaths = k==='photo' ? (book.pages||[]).map(p=>p.img&&p.img.path).filter(Boolean) : [];
    const r=await rpc('drawer_item_remove',{p_id:book.id}); if(r.err){ say(r.err); return; }
    cur.items=cur.items.filter(x=>x.id!==book.id);
    book=null; show('vIn'); renderItems(); $('inSub').textContent=sub(cur); say(k==='photo'?'相册删掉了':'日记本删掉了');
    // 数据库记录已删，再清 Storage 里的照片文件（失败仅留下无害孤儿文件，不阻断）
    photoPaths.forEach(p=>storageDelete(p).catch(()=>{}));
  });
  $('pPrev').onclick=()=>{ if(pi>0){ pi--; renderPage(true); } };
  $('pNext').onclick=()=>{ if(pi<book.pages.length-1){ pi++; renderPage(true); } };
  let sx=null;
  $('leaf').addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true});
  $('leaf').addEventListener('touchend',e=>{
    if(sx==null||wmode) return;
    const dx=e.changedTouches[0].clientX-sx; sx=null;
    if(dx<-50) $('pNext').click(); else if(dx>50) $('pPrev').click();
  });
  $('pNew').onclick=()=>{
    if(book.kind==='photo'){
      pendingImg=null; $('phPrev').hidden=true; $('phPrev').src='';
      $('phFile').click();
    }else{
      $('wr').value=''; setWrite(true,'new'); if(!coarse()) $('wr').focus({preventScroll:true});
    }
  };
  $('phFile').onchange=()=>{
    const f=$('phFile').files && $('phFile').files[0];
    $('phFile').value='';
    if(!f) return;
    if(!f.type || f.type.indexOf('image/')!==0){ say('选一张图片吧'); return; }
    pendingImg=f;
    $('phPrev').src=URL.createObjectURL(f); $('phPrev').hidden=false;
    $('wr').value=''; setWrite(true,'new');
    if(!coarse()) $('wr').focus({preventScroll:true});
  };
  $('pEdit').onclick=()=>{ $('wr').value=book.kind==='photo'?book.pages[pi].cap:book.pages[pi].text; setWrite(true,'edit'); if(!coarse()) $('wr').focus({preventScroll:true}); };
  $('pDel').onclick=()=>{
    if(delArm){ doDel(); return; }
    delArm=true;
    $('pDel').classList.add('arm');
    $('pDel').textContent=book.kind==='photo'?'再点一下，真的删掉？':'再点一下，真的撕掉？';
    clearTimeout(delTimer);
    delTimer=setTimeout(()=>{ delArm=false; $('pDel').classList.remove('arm'); $('pDel').textContent=book.kind==='photo'?'删掉这张':'撕掉这页'; },5000);
  };
  async function doDel(){
    clearTimeout(delTimer); delArm=false;
    const isPhoto=book.kind==='photo';
    const gone=isPhoto?book.pages[pi]:null;
    const pages=book.pages.slice(); pages.splice(pi,1);
    const r=await rpc('drawer_item_update',{p_id:book.id,p_content:await reenc(book,JSON.stringify(pages))});
    if(r.err){ say(r.err); $('pDel').classList.remove('arm'); $('pDel').textContent=isPhoto?'删掉这张':'撕掉这页'; return; }
    book.pages=pages;
    if(gone && gone.img && gone.img.path) storageDelete(gone.img.path).catch(()=>{});
    if(pi>=pages.length) pi=Math.max(0,pages.length-1);
    renderPage(true);
    say(isPhoto?'这张照片删掉了':'这一页撕掉了');
  }
  $('wrCancel').onclick=()=>{ if(document.activeElement===$('wr')) $('wr').blur(); setWrite(false); };
  $('wrOk').onclick=async()=>{
    const t=$('wr').value.trim();
    const pages=book.pages.slice();
    if(book.kind==='photo'){
      if(wmode==='new'){
        if(!pendingImg){ say('先选一张照片吧'); return; }
        const img=await uploadPhoto(pendingImg);
        if(!img){ say('照片没传上去，稍后再试'); return; }
        pages.push({id:now(),cap:t,at:new Date().toISOString(),img:img});
      }else{
        pages[pi]=Object.assign({},pages[pi],{cap:t});
      }
    }else{
      if(!t){ say('还没写什么呢'); return; }
      if(wmode==='new') pages.push({id:now(),text:t,at:new Date().toISOString()}); else pages[pi]=Object.assign({},pages[pi],{text:t});
    }
    const r=await rpc('drawer_item_update',{p_id:book.id,p_content:await reenc(book,JSON.stringify(pages))});
    if(r.err){ say(r.err); return; }
    book.pages=pages; if(wmode==='new') pi=pages.length-1;
    if(document.activeElement===$('wr')) $('wr').blur();
    pendingImg=null; $('phPrev').hidden=true; $('phPrev').src='';
    setWrite(false); renderPage(true); say('记好了');
  };
  $('rdBack').onclick=()=>{ show('vIn'); renderItems(); $('inSub').textContent=sub(cur); };
  $('rdCover').onclick=()=>openCover(book);

  /* 新开抽屉：页面里的一个视图，没有浮层 */
  const pvSub=()=>{ const lk=$('nLock').value; $('pvS').textContent=(lk==='none'?'':'🔒 '+LOCK[lk]+' · ')+'还是空的'; };
  function openNew(){
    newColor=PAL[drawers.length%3];
    $('nTitle').value=''; $('nLock').value='none'; lockUI('nLock','nPass','nQ'); resetTime('n'); $('nPass').value=''; $('nQ').value=''; $('nVis').checked=true;
    $('pvT').textContent='新抽屉'; pvSub();
    $('pv').style.setProperty('--tone',newColor);
    palette($('nPal'),()=>newColor,c=>{ newColor=c; $('pv').style.setProperty('--tone',c); },()=>{});
    freeze(true); show('vNew'); window.scrollTo(0,0);
    // 手机上不自动聚焦：等你自己点输入框再弹键盘，避免和页面变化撞车
    if(!coarse()) $('nTitle').focus({preventScroll:true});
  }
  function closeNew(){
    if(document.activeElement===$('nTitle')) $('nTitle').blur();
    show('vList'); freeze(false);
  }
  $('nTitle').addEventListener('input',()=>{ $('pvT').textContent=$('nTitle').value.trim()||'新抽屉'; });
  $('nLock').onchange=()=>{ pvSub(); lockUI('nLock','nPass','nQ'); };
  $('nOk').onclick=async()=>{
    const t=$('nTitle').value.trim();
    if(!t){ say('先给它起个名字吧'); return; }
    const lk=$('nLock').value, vis=$('nVis').checked;
    const unlock_at=lk==='time'?computeUnlockAt('n'):null;
    if(lk==='time'&&!unlock_at) return;
    let title=t, question=null, salt=null, nonce=null, verifier=null;
    if(lk==='password'||lk==='question'){
      const pass=$('nPass').value.trim();
      if(!pass){ say(lk==='password'?'密码锁要先设个密码':'问题锁要先设个答案'); return; }
      if(lk==='question'){
        const q=$('nQ').value.trim();
        if(!q){ say('问题锁要先设个问题'); return; }
        question=q;
      }
      const s=_b64(crypto.getRandomValues(new Uint8Array(16)));
      const key=await _derive(pass,s);
      const v=await _seal(_SENTINEL,key);
      salt=s; nonce=v.iv; verifier=v.data;
    }
    const r=await rpc('drawer_create',{p_title:title,p_question:question,p_visible:vis,p_lock_kind:lk,p_color:newColor,p_lock_salt:salt,p_lock_nonce:nonce,p_lock_verifier:verifier,p_unlock_at:unlock_at});
    if(r.err){ say(r.err); return; }
    if(r.data==null){ say('抽屉没放好，稍后再试'); return; }
    drawers.push({id:Number(r.data),title:title,question:question,visible:vis,lock_kind:lk,color:newColor,
      unlock_at:unlock_at,items:[],lock_salt:salt,lock_nonce:nonce,lock_verifier:verifier});
    closeNew(); renderList(); say('新抽屉放好了');
  };
  $('nCancel').onclick=closeNew;
  $('vClose').onclick=()=>$('mView').classList.remove('on');
  $('mView').addEventListener('click',e=>{ if(e.target===$('mView')) $('mView').classList.remove('on'); });
  /* 二次确认删除：第一次点变「再点一下删除」，第二次点才真正删 */
  function resetArm(btn,label){ btn.dataset.arm=''; btn.classList.remove('arm'); btn.textContent=label; }
  function armRun(btn,label,run){
    if(btn.dataset.arm==='1'){ resetArm(btn,label); run(); return; }
    btn.dataset.arm='1'; btn.classList.add('arm'); btn.textContent='再点一下删除';
    clearTimeout(btn._t); btn._t=setTimeout(()=>resetArm(btn,label),5000);
  }
  $('vDel').onclick=()=>armRun($('vDel'),'删掉',async()=>{
    const it=curNote; if(!it) return;
    const r=await rpc('drawer_item_remove',{p_id:it.id}); if(r.err){ say(r.err); return; }
    cur.items=cur.items.filter(x=>x.id!==it.id);
    $('mView').classList.remove('on'); renderItems(); say('纸条删掉了');
  });
  $('shut').onclick=shut;
  /* 新建纸条：颜色 + 纹路 */
  function openNote(){
    $('noteTxt').value='';
    noteColor=PAL[0]; notePattern='petal';
    $('noteLock').value='none'; lockUI('noteLock','notePass','noteQ'); resetTime('note');
    $('notePass').value=''; $('noteQ').value='';
    const refresh=()=>patSwatches($('notePats'),()=>noteColor,()=>notePattern,k=>notePattern=k);
    palette($('notePal'),()=>noteColor,c=>{ noteColor=c; refresh(); },()=>{});
    refresh();
    $('mNote').classList.add('on');
    if(!coarse()) $('noteTxt').focus({preventScroll:true});
  }
  $('noteCancel').onclick=()=>$('mNote').classList.remove('on');
  $('mNote').addEventListener('click',e=>{ if(e.target===$('mNote')) $('mNote').classList.remove('on'); });
  $('noteOk').onclick=async()=>{
    const t=$('noteTxt').value.trim();
    if(!t){ say('先写点什么再放进去'); return; }
    const wantTime=$('noteLock').value==='time';
    const drawerEnc=(cur.lock_kind==='password'||cur.lock_kind==='question') && cur._pass;
    const inherits=drawerEnc && ($('noteLock').value==='none'||wantTime);
    const lk=wantTime?'time':(inherits?cur.lock_kind:$('noteLock').value);
    const unlock_at=lk==='time'?computeUnlockAt('note'):null;
    if(lk==='time'&&!unlock_at) return;
    let content=t, title=null, question=inherits?(cur.question||null):null, salt=null, nonce=null, verifier=null;
    if(inherits){
      const key=await _derive(cur._pass, cur.lock_salt);
      const enc=await _seal(content,key);
      salt=cur.lock_salt; nonce=cur.lock_nonce; verifier=cur.lock_verifier; content=enc.iv+'.'+enc.data;
    }else if(lk==='password'||lk==='question'){
      const pass=$('notePass').value.trim();
      if(!pass){ say(lk==='password'?'密码锁要先设个密码':'问题锁要先设个答案'); return; }
      if(lk==='question'){
        const q=$('noteQ').value.trim();
        if(!q){ say('问题锁要先设个问题'); return; }
        question=q;
      }
      const lc=await lockContent(pass,t);
      salt=lc.salt; nonce=lc.nonce; verifier=lc.verifier; content=lc.content;
    }
    const r=await rpc('drawer_item_add',{p_drawer_id:cur.id,p_kind:'note',p_title:title,p_question:question,p_color:noteColor,p_pattern:notePattern,p_lock_kind:lk,p_media_path:null,p_lock_salt:salt,p_lock_nonce:nonce,p_lock_verifier:verifier,p_content:content,p_unlock_at:unlock_at});
    if(r.err){ say(r.err); return; }
    if(r.data==null){ say('纸条没放进去，稍后再试'); return; }
    const it={id:Number(r.data),kind:'note',content:content,lock_kind:lk,color:noteColor,pattern:notePattern,unlock_at:unlock_at,title:title,question:question,lock_salt:salt,lock_nonce:nonce,lock_verifier:verifier};
    cur.items.push(it);
    $('mNote').classList.remove('on');
    renderItems(); say('纸条放进去了');
  };
  $('addItem').onclick=openNote;
  $('back').onclick=()=>{ location.href='play.html'; };
  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape') return;
    $('mView').classList.remove('on');
    $('mNote').classList.remove('on');
    if(!$('vNew').hidden) closeNew(); else if(!$('vCover').hidden) $('cvCancel').click();
  });

  loadDrawers();
})();
</script>
