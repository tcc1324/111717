<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投资卡 · 给聆遇的游乐园</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌙%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/base.css?v=2026102410">
  <style>
    body { min-height: 100vh; margin: 0; background: linear-gradient(180deg, #fff8e1 0%, #fdeaf0 52%, #e6f1ff 100%); color: #222; display: flex; flex-direction: column; align-items: center; }
    .top { width: calc(100% - 32px); max-width: 480px; display: flex; align-items: center; justify-content: space-between; margin-top: 20px; }
    .top a { color: #222; text-decoration: none; font-size: 16px; }
    .top h1 { font-size: 22px; font-weight: normal; letter-spacing: .2em; margin: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.05; }
    .top h1 small { font-family: Georgia, "Times New Roman", serif; font-size: 8.5px; font-weight: normal; letter-spacing: .3em; color: #bda994; margin-top: 4px; margin-right: -.3em; }

    .bar { width: calc(100% - 44px); max-width: 480px; margin-top: 26px; display: flex; align-items: baseline; justify-content: space-between; }
    .bar .note { font-size: 11.5px; color: #b0a094; letter-spacing: .06em; }
    .bar .coin { font-size: 12px; color: #a8874a; letter-spacing: .1em; }
    .bar .coin b { font-family: Georgia, "Songti SC", serif; font-size: 16px; font-weight: normal; color: #6b5120; margin-left: 5px; }

    /* 空卡池 */
    .pool { width: calc(100% - 44px); max-width: 480px; margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .slot { aspect-ratio: 1 / 1.32; border-radius: 20px; border: 1.5px dashed rgba(150,124,98,.28); background: rgba(255,255,255,.34); display: flex; align-items: center; justify-content: center; }
    .slot svg { width: 26px; height: 26px; stroke: rgba(150,124,98,.34); fill: none; stroke-width: 1.2; }

    .empty { width: calc(100% - 60px); max-width: 440px; margin-top: 30px; text-align: center; color: #b0a094; font-size: 13.5px; line-height: 2.2; letter-spacing: .1em; }
    .empty b { display: block; font-size: 15px; font-weight: normal; color: #8d7764; letter-spacing: .14em; margin-bottom: 8px; }

    .foot { margin-top: auto; padding: 38px 0 26px; color: #ab9a8b; font-size: 12.5px; letter-spacing: .07em; text-align: center; line-height: 2; }
  </style>
</head>
<body>
  <div class="top"><a href="bank.html">‹ 回去</a><h1>投资卡<small>INVESTMENT CARDS</small></h1><span style="width:48px"></span></div>

  <div class="bar">
    <div class="note">卡池空着 · 等铃儿画</div>
    <div class="coin">月光币<b id="bal">—</b></div>
  </div>

  <div class="pool">
    <div class="slot"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg></div>
    <div class="slot"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg></div>
  </div>

  <div class="empty">
    <b>还没有一张卡</b>
    卡面、稀有度、价格、怎么涨怎么跌<br>都等铃儿定下来，再一张张贴上去
  </div>

  <div class="foot">这里暂时只是一块空地<br>风穿过去，什么也没留下</div>

  <script src="assets/js/common.js?v=2026100802"></script>
  <script src="assets/js/auth.js?v=2026100802"></script>
  <script>
    (async function () {
      const $ = id => document.getElementById(id);
      const s = await Park.session();
      if (!s) return location.replace('login.html');
      let uid = '';
      try {
        const p = atob(s.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'));
        uid = JSON.parse(p).sub || '';
      } catch (e) {}

      const trimNum = v => {
        const n = Number(v);
        if (!isFinite(n)) return '0';
        if (Number.isInteger(n)) return String(n);
        return String(Number(n.toFixed(4)));
      };

      try {
        const r = await Park.api('profiles?select=moon_coins&id=eq.' + uid);
        const me = r.ok ? (await r.json())[0] : null;
        $('bal').textContent = me ? trimNum(me.moon_coins ?? 0) : '—';
      } catch (e) { $('bal').textContent = '—'; }
    })();
  </script>
</body>
</html>
